name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: No-shell guard
        run: ./scripts/no-shell-guard.sh
      - name: Go test
        run: go test ./...
      - name: Build
        run: make build
