# Older path only: Jitsi captions and Element voice messages with an API key.
# This is not the synaplan-charts release. That release deploys the
# synascriber plugin (technical.synaplan.synascriber). See
# docs/OPENDESK_MEETING_NOTES.md, section "Older path".
#
# Meeting notes stay off until synaplan.url and synaplan.transcribeToken are set.
# Jitsi (Nordeck) then points jicofo.transcription.url-template at
#   wss://<notes-host>/transcribe?sessionId={{MEETING_ID}}&sendBack=true
# with an Authorization header of the transcriber auth token.

synaplan:
  url: https://synaplan.example
  transcribeToken: ""
  sttModel: ""

transcriber:
  mode: opendesk
  publicUrl: https://notes.example
  authToken: ""
  language: auto
  commitAfterMs: 8000

notes:
  nextcloudFolder: /Meetings
  matrixRoom: ""
  saveToSynaplan: true

matrix:
  homeserver: https://matrix.example
  userId: "@synaplan-notes:example"
  accessToken: ""

nextcloud:
  url: https://files.example
  user: ""
  appPassword: ""
