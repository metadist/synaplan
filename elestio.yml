config:
  runTime: "dockerCompose"
  version: ""
  framework: ""
  installCommand: ""
  # Both commands go through deploy/scripts/, which reaches Compose through
  # lib.sh's compose(). A `docker compose` call here would read deploy/.env only
  # and miss a configuration materialised as a checkout-root .env.
  buildCommand: "./deploy/scripts/build.sh"
  buildDir: "/"
  runCommand: "./deploy/scripts/run.sh"
  isMonoRepoPackageInRoot: false

environments:
  - key: "COMPOSE_PROJECT_NAME"
    value: "synaplan"
  # Maintained by CI: publishing a release opens a pull request that raises this
  # to the version whose image was just published and verified. Do not edit it by
  # hand — scripts/set-release-version.mjs owns this line.
  #
  # Elestio materialises these values into the deployment's .env automatically,
  # so this has to name a release that already exists in GHCR — there is no step
  # in which an operator could substitute a placeholder before the first deploy.
  # Only an immutable SemVer release is accepted here: the pre-install hook
  # rejects `latest`, any mutable tag and any version that is not published yet,
  # before a container starts. Raising this value is what ships a new release to
  # new deployments; existing ones stay on their pinned version until their
  # operator changes it, as described in docs/UPDATE_ELESTIO.md.
  - key: "SYNAPLAN_VERSION"
    value: "4.5.0"
  # Deployment hint for the release notice, so the admin UI links to the Elestio
  # update guide instead of the self-hosted one. Display only: Synaplan never
  # updates itself.
  - key: "SYNAPLAN_PLATFORM"
    value: "elestio"
  # The Docker bridge gateway, which is exactly the `targetIP` the reverse-proxy
  # route below connects to — and the binding Elestio's own compose examples
  # use. Binding 0.0.0.0 instead published the app as plain HTTP on every host
  # interface: Docker writes its own iptables rules, so a host firewall does not
  # close that port, and the HTTPS proxy in front of it could simply be bypassed.
  - key: "SYNAPLAN_HTTP_BIND"
    value: "172.17.0.1"
  - key: "SYNAPLAN_HTTP_PORT"
    value: "8000"
  - key: "APP_URL"
    value: "https://[CI_CD_DOMAIN]"
  - key: "FRONTEND_URL"
    value: "https://[CI_CD_DOMAIN]"
  - key: "MARIADB_DATABASE"
    value: "synaplan"
  - key: "MARIADB_USER"
    value: "synaplan"
  # APP_SECRET, TOKEN_SECRET, MARIADB_PASSWORD, MARIADB_ROOT_PASSWORD and the four
  # REALTIME_* secrets are deliberately absent here. The `random_password`
  # placeholder is ONE draw per deployment and the same value is substituted into
  # every variable that names it, so declaring them produced an installation in
  # which the database password, the secret that signs every application token and
  # the Centrifugo admin password were all one string. The lifecycle scripts in
  # deploy/scripts/ generate them instead — one independent value each, recorded
  # once in deploy/data/secrets.env, which is the only location that survives a
  # redeploy because Elestio rewrites this deployment's .env every time. An
  # existing deployment keeps the values it already runs with: they are adopted
  # from the environment on the first start after this change.
  - key: "REALTIME_ALLOWED_ORIGINS"
    value: "https://[CI_CD_DOMAIN]"
  - key: "BOOTSTRAP_ADMIN_EMAIL"
    value: "[EMAIL]"
  - key: "BOOTSTRAP_ADMIN_PASSWORD"
    value: "random_password"
  - key: "AI_DEFAULT_PROVIDER"
    value: "groq"
  - key: "COMPOSE_PROFILES"
    value: ""
  - key: "ENABLE_LOCAL_GPT_OSS"
    value: "false"

ports:
  - protocol: "HTTPS"
    targetProtocol: "HTTP"
    listeningPort: "443"
    targetPort: "8000"
    targetIP: "172.17.0.1"
    public: true
    path: "/"
    isAuth: false

lifeCycleConfig:
  preInstallCommand: "./deploy/elestio/pre-install.sh"
  postInstallCommand: "./deploy/elestio/post-install.sh"
  preBackupCommand: "./deploy/elestio/pre-backup.sh"
  postBackupCommand: "./deploy/elestio/post-backup.sh"
  preRestoreCommand: "./deploy/elestio/pre-restore.sh"
  postRestoreCommand: "./deploy/elestio/post-restore.sh"
  preUpdateCommand: "./deploy/elestio/pre-update.sh"
  postUpdateCommand: "./deploy/elestio/post-update.sh"
  preDeployCommand: "./deploy/elestio/pre-deploy.sh"
  postDeployCommand: "./deploy/elestio/post-deploy.sh"

webUI:
  - url: "https://[CI_CD_DOMAIN]"
    label: "Synaplan"
    login: "[BOOTSTRAP_ADMIN_EMAIL]"
    password: "[BOOTSTRAP_ADMIN_PASSWORD]"

monoRepoWorkSpaces: []
