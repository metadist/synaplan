<!doctype html>
<html lang="en" class="design-v2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Favicon for modern browsers (SVG) -->
    <link rel="icon" type="image/svg+xml" href="/single_bird.svg" />
    <!-- Fallback favicon for older browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Apple Touch Icon for iOS home screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Web App Manifest for Android/PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Plus Jakarta Sans ships with the bundle (see main.ts). Loading it from a
         font CDN would make rendering depend on an outside host, which fails in a
         private subnet or an air-gapped install, and would send every visitor's
         request to a third party. -->
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#003fc7" />

    <!-- iOS PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Synaplan" />

    <meta name="description" content="AI-powered knowledge management" />
    <title>Synaplan</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
