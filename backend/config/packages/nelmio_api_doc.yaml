nelmio_api_doc:
    documentation:
        info:
            title: Synaplan API
            description: Synaplan AI Assistant API Documentation
            license:
                name: Apache-2.0
                url: https://www.apache.org/licenses/LICENSE-2.0.html
            # Sourced from APP_VERSION (git tag, set at build time), matching the
            # runtime config's build.version. Falls back to 'dev' locally.
            version: '%env(default:app_version_default:APP_VERSION)%'
        servers:
            - url: http://localhost:8000
              description: Local development server
        components:
            schemas:
                # Projects: a name, instructions and sources (ProjectPresenter).
                Project:
                    type: object
                    required: [id, name, description, instructions, pinned, timezone, currency, createdAt, updatedAt]
                    properties:
                        id: {type: string, format: uuid, example: 7b0f4c1e-6a4e-4a4b-9d0e-3a5b7c9d1e2f}
                        name: {type: string, example: New kitchen}
                        description: {type: string, nullable: true}
                        instructions: {type: string, nullable: true}
                        pinned: {type: boolean, description: Pinned projects are listed first}
                        timezone: {type: string, example: "Europe/Berlin", description: "IANA zone the board's times are read and said in: the project's own, else the owner's, else UTC"}
                        currency: {type: string, nullable: true, example: "EUR", description: "ISO 4217 code of the board's costs"}
                        createdAt: {type: string, format: date-time}
                        updatedAt: {type: string, format: date-time}
                ProjectSource:
                    type: object
                    required: [id, name, kind, state, reason, sourceUrl, fetchedAt, size, createdAt]
                    properties:
                        id: {type: integer, example: 42}
                        name: {type: string, example: offer.pdf}
                        kind: {type: string, enum: [file, link, text]}
                        state: {type: string, enum: [reading, ready, failed]}
                        reason: {type: string, nullable: true, description: Why a source is failed}
                        sourceUrl: {type: string, nullable: true}
                        fetchedAt: {type: integer, nullable: true, description: Unix time of the last fetch of a link}
                        size: {type: integer}
                        createdAt: {type: integer, description: Unix time}
                ProjectBoardItem:
                    type: object
                    description: "One item of a project's board. An all-day time is a calendar day (2026-11-30), any other time ISO 8601 in UTC."
                    required: [id, kind, state, parentId, sort, visibility, waitingSince, title, detail, startAt, endAt, dueAt, allDay, rrule, contact, amount, estimated, sourceKind, createdAt, updatedAt]
                    properties:
                        id: {type: string, format: uuid}
                        kind: {type: string, enum: [task, date, decision, cost, note]}
                        state: {type: string, enum: [proposed, open, done, dropped], description: "proposed waits for a yes; an open decision is an open question; an open cost is planned, a done cost is paid"}
                        parentId: {type: string, format: uuid, nullable: true, description: "The date a task belongs to, or the decision a cost belongs to"}
                        sort: {type: integer, nullable: true, description: "Order inside a plan"}
                        visibility: {type: string, enum: [project, private]}
                        waitingSince: {type: string, format: date-time, nullable: true, description: "Set while a task waits on someone else"}
                        title: {type: string, example: "Measure the kitchen niche"}
                        detail: {type: string, nullable: true}
                        startAt: {type: string, nullable: true, description: "A date's start"}
                        endAt: {type: string, nullable: true, description: "A date's end"}
                        dueAt: {type: string, nullable: true, description: "A task's due time"}
                        allDay: {type: boolean}
                        rrule: {type: string, nullable: true, example: "FREQ=WEEKLY;BYDAY=MO", description: "Repetition of a date, a subset of RFC 5545"}
                        contact: {type: string, nullable: true, example: "Mr Vogt, kitchen studio"}
                        amount: {type: string, nullable: true, example: "8400.00", description: "A cost's amount in the project's currency"}
                        estimated: {type: boolean, description: "The amount is an estimate"}
                        sourceKind: {type: string, enum: [message, file, manual]}
                        createdAt: {type: string, format: date-time}
                        updatedAt: {type: string, format: date-time}
                ProjectBoardItemChange:
                    type: object
                    description: "The fields of an item. A kind takes only its own: task (title, detail, parentId, sort, dueAt, allDay, contact, waiting), date (title, detail, sort, startAt, endAt, allDay, rrule, contact), decision and note (title, detail), cost (title, detail, parentId, amount, estimated). A time without a zone is read in the project's zone; a calendar day makes the item all-day."
                    properties:
                        state: {type: string, enum: [open, done, dropped]}
                        title: {type: string, maxLength: 200}
                        detail: {type: string, maxLength: 1000, nullable: true}
                        parentId: {type: string, format: uuid, nullable: true}
                        sort: {type: integer, minimum: 0, maximum: 100000, nullable: true}
                        startAt: {type: string, nullable: true, example: "2026-11-30T10:00"}
                        endAt: {type: string, nullable: true}
                        dueAt: {type: string, nullable: true, example: "2026-12-02"}
                        allDay: {type: boolean}
                        rrule: {type: string, nullable: true, example: "FREQ=WEEKLY;BYDAY=MO"}
                        contact: {type: string, maxLength: 200, nullable: true}
                        waiting: {type: boolean, description: "The task waits on someone else"}
                        amount: {oneOf: [{type: string}, {type: number}], example: "8400.00"}
                        estimated: {type: boolean}
                ProjectBoardItemInput:
                    type: object
                    description: "A new item: kind and title, a date also startAt, a cost also amount, then the fields of its kind as in ProjectBoardItemChange, without state."
                    required: [kind, title]
                    properties:
                        kind: {type: string, enum: [task, date, decision, cost, note]}
                        title: {type: string, maxLength: 200, example: "Measure the kitchen niche"}
                        detail: {type: string, maxLength: 1000, nullable: true}
                        parentId: {type: string, format: uuid, nullable: true}
                        sort: {type: integer, minimum: 0, maximum: 100000, nullable: true}
                        startAt: {type: string, nullable: true, example: "2026-11-30T10:00"}
                        endAt: {type: string, nullable: true}
                        dueAt: {type: string, nullable: true, example: "2026-12-02"}
                        allDay: {type: boolean}
                        rrule: {type: string, nullable: true}
                        contact: {type: string, maxLength: 200, nullable: true}
                        waiting: {type: boolean}
                        amount: {oneOf: [{type: string}, {type: number}], example: "8400.00"}
                        estimated: {type: boolean}
                ProjectChat:
                    type: object
                    required: [id, title, updatedAt]
                    properties:
                        id: {type: integer}
                        title: {type: string}
                        updatedAt: {type: string, format: date-time}
                # What Synaplan's OAuth server endpoints answer when they
                # refuse (RFC 6749 section 5.2, RFC 7591 section 3.2.2).
                OAuthError:
                    type: object
                    required: [error]
                    properties:
                        error:
                            type: string
                            example: invalid_request
                        error_description:
                            type: string
                # Client metadata a cloud sends (RFC 7591). A registration
                # needs software_id, client_uri, redirect_uris and jwks; an
                # update changes what it names.
                OAuthClientMetadata:
                    type: object
                    properties:
                        software_id:
                            type: string
                            enum: [nextcloud, owncloud]
                        client_uri:
                            type: string
                            example: https://cloud.example.com
                            description: The cloud's address. It cannot change later.
                        redirect_uris:
                            type: array
                            items: { type: string }
                            description: On the cloud's host; at most ten.
                        jwks:
                            type: object
                            description: >-
                                One to five public signing keys (RFC 7517): RSA
                                of 2048 bits or more (RS256) or EC P-256
                                (ES256). Several keys each need a kid.
                        token_endpoint_auth_method:
                            type: string
                            example: private_key_jwt
                        grant_types:
                            type: array
                            items:
                                type: string
                                enum: [authorization_code, refresh_token]
                            description: Optional; no other grant is offered.
                        response_types:
                            type: array
                            items:
                                type: string
                                enum: [code]
                            description: Optional; no other response type is offered.
                        client_id:
                            type: string
                            description: Optional in an update; it has to be the client's own.
                        delivery_url:
                            type: string
                            description: Where Synaplan's servers call the cloud.
                        app_capabilities:
                            type: array
                            items: { type: string }
                        software_version:
                            type: string
                        server_id:
                            type: string
                # The client as Synaplan keeps it (RFC 7591 / RFC 7592).
                OAuthClient:
                    type: object
                    required:
                        - client_id
                        - client_uri
                        - software_id
                        - redirect_uris
                        - token_endpoint_auth_method
                        - jwks
                        - registration_client_uri
                        - status
                    properties:
                        client_id:
                            type: string
                            example: pi_3f9a1c0b7d2e4a6c8b1d0e2f
                        client_id_issued_at:
                            type: integer
                            description: Only in the answer to a registration.
                        client_uri:
                            type: string
                            example: https://cloud.example.com
                        software_id:
                            type: string
                            enum: [nextcloud, owncloud]
                        redirect_uris:
                            type: array
                            items: { type: string }
                        grant_types:
                            type: array
                            items: { type: string }
                            example: [authorization_code, refresh_token]
                        response_types:
                            type: array
                            items: { type: string }
                            example: [code]
                        token_endpoint_auth_method:
                            type: string
                            example: private_key_jwt
                        jwks:
                            type: object
                            description: The client's public signing keys (RFC 7517).
                        registration_client_uri:
                            type: string
                            example: https://synaplan.example/oauth/register/pi_3f9a1c0b7d2e4a6c8b1d0e2f
                        status:
                            type: string
                            enum: [pending, active, revoked]
                            description: A pending client waits for an administrator and cannot link anyone yet.
                        delivery_url:
                            type: string
                            description: Empty when the cloud has none.
                        app_capabilities:
                            type: array
                            items: { type: string }
                        reachable:
                            type: boolean
                            nullable: true
                            description: Whether delivery_url answered; null when not tried.
                        software_version:
                            type: string
                        server_id:
                            type: string
            securitySchemes:
                CookieAuth:
                    type: apiKey
                    in: cookie
                    name: access_token
                    description: 'HttpOnly cookie-based authentication. Tokens are set automatically on login.'
                Bearer:
                    type: http
                    scheme: bearer
                    description: 'Bearer token for SSE connections. Get token from /api/v1/auth/token endpoint.'
                ApiKey:
                    type: apiKey
                    in: header
                    name: X-API-Key
                    description: 'Synaplan API key (sk_...), sent in the X-API-Key header.'
    areas:
        path_patterns:
            - ^/api(?!/doc$) # Accepts all routes except /api/doc
            # Discovery documents a cloud reads before it trusts a notification.
            - ^/\.well-known/(synaplan-configuration|jwks\.json)$
            # The OAuth2 authorization server a cloud links people through.
            - ^/\.well-known/oauth-authorization-server$
            - ^/oauth/
            # Desktop project companion (paired keys). The rest of /v1 stays
            # out of the published spec — it is the OpenAI/Anthropic gateway.
            - ^/v1/models/catalog
            # Except chat completions: the cloud apps ask about a file with it
            # and generate their Synaplan client from this spec.
            - ^/v1/chat/completions$
            - ^/v1/assistants
