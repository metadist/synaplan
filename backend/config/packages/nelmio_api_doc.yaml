nelmio_api_doc:
    documentation:
        info:
            title: Synaplan API
            description: Synaplan AI Assistant API Documentation
            license:
                name: Apache-2.0
                url: https://www.apache.org/licenses/LICENSE-2.0.html
            # Sourced from APP_VERSION (git tag, set at build time), matching the
            # runtime config's build.version. Falls back to 'dev' locally.
            version: '%env(default:app_version_default:APP_VERSION)%'
        servers:
            - url: http://localhost:8000
              description: Local development server
        components:
            securitySchemes:
                CookieAuth:
                    type: apiKey
                    in: cookie
                    name: access_token
                    description: 'HttpOnly cookie-based authentication. Tokens are set automatically on login.'
                Bearer:
                    type: http
                    scheme: bearer
                    description: 'Bearer token for SSE connections. Get token from /api/v1/auth/token endpoint.'
                ApiKey:
                    type: apiKey
                    in: header
                    name: X-API-Key
                    description: 'Synaplan API key (sk_...), sent in the X-API-Key header.'
                PlatformInstanceId:
                    type: apiKey
                    in: header
                    name: X-Instance-Id
                    description: 'A connected cloud''s instance id. Sent together with PlatformInstanceSecret on the calls the cloud makes as itself.'
                PlatformInstanceSecret:
                    type: apiKey
                    in: header
                    name: X-Instance-Secret
                    description: 'The secret Synaplan issued when the cloud registered. Sent together with PlatformInstanceId.'
    areas:
        path_patterns:
            - ^/api(?!/doc$) # Accepts all routes except /api/doc
            # Discovery documents a cloud reads before it trusts a notification.
            - ^/\.well-known/(synaplan-configuration|jwks\.json)$
            # Desktop project companion (paired keys). The rest of /v1 stays
            # out of the published spec — it is the OpenAI/Anthropic gateway.
            - ^/v1/models/catalog
            - ^/v1/assistants
