# Rate-limiter named-limiter definitions.
#
# The shared cache pool that backs every limiter (`cache.rate_limiter`) is
# declared in `config/packages/cache.yaml` alongside all other pools so the
# `when@test` override path is consistent. Defining the pool in two YAML
# files made Symfony's CachePass retain the prod Redis `provider` argument
# as ctor arg 0 even when the test profile swapped the adapter, which then
# crashed kernel boot with "argument 1 doesn't exist in" the test adapter.
#
# Add named limiters here when needed (login attempts, message quotas, etc.):
#
#   framework:
#       rate_limiter:
#           login:
#               policy: 'fixed_window'
#               limit: 5
#               interval: '15 minutes'
#               cache_pool: 'cache.rate_limiter'

framework:
    rate_limiter:
        # Anonymous Centrifugo token endpoints (PUBLIC_ACCESS). Keyed per
        # client IP in RealtimeTokenController. Sized for legitimate traffic —
        # one active visitor needs ~3 requests/minute (connection token +
        # session/typing subscription refreshes at 60s TTL), so 60/120 per
        # minute tolerates dozens of visitors behind one NAT while making
        # widget/session id enumeration useless (client-generated
        # `sess_{ts}_{~46 random bits}` ids are infeasible to hit at ≤2
        # guesses per second).
        realtime_widget_token:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'
        realtime_subscribe_anon:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'
        # First-run setup endpoints (PUBLIC_ACCESS, keyed per client IP in
        # SetupController). They are only reachable on an installation that has
        # not a single user yet, and the very first successful POST closes the
        # window for good — so this limit exists to blunt scripted hammering of
        # a virgin instance, not to ration a workflow. A human needs one or two
        # attempts; 10/minute leaves room for a mistyped password.
        setup_attempt:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'
        # People picker (`GET /api/v1/iam/subjects`), keyed per user in
        # ShareController. A person typing a name fires one request per
        # keystroke, so 60/minute is generous for real use while making a
        # scripted walk over the directory (one probe per letter) slow
        # enough to be pointless.
        iam_subject_search:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'

        # Smart Search palette (POST /api/v1/search). The palette debounces
        # typing, so 60/minute covers fast real use while capping a script. Each
        # search may also spend one metered query embedding.
        smart_search:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'
        # AI tier of the palette (POST /api/v1/search/interpret). Each call is
        # one model request (the person's chat model unless an admin pins one),
        # so the cap is far below plain search. It also spends MESSAGES quota.
        smart_search_interpret:
            policy: 'sliding_window'
            limit: 20
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'
        # Public Saved Task webhook (`POST /api/v1/webhooks/saved-tasks/{token}`,
        # PUBLIC_ACCESS), keyed per task in SavedTaskWebhookIngress. One start
        # per second is far beyond any real integration and keeps a leaked
        # address from flooding the owner's usage quota.
        saved_task_webhook:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'
        # Account creation (SignupGuard): the email form and every OAuth
        # callback that would create an account. Keyed per client IP; sized
        # for a household or small office behind one address (SIGNUP_IP_LIMIT,
        # default 5 per hour). Counts attempts, so a failing script is slowed too.
        signup_ip:
            policy: 'sliding_window'
            limit: '%env(int:SIGNUP_IP_LIMIT)%'
            interval: '1 hour'
            cache_pool: 'cache.rate_limiter'
        # Installation-wide ceiling on new accounts (SIGNUP_GLOBAL_LIMIT, default
        # 20 per 10 minutes). Normal days see a handful; the 2026-10-24 burst did
        # 15–30 per minute. Tripping it also mails the operator.
        signup_global:
            policy: 'sliding_window'
            limit: '%env(int:SIGNUP_GLOBAL_LIMIT)%'
            interval: '10 minutes'
            cache_pool: 'cache.rate_limiter'
        # Stripe checkout sessions per client IP (CHECKOUT_IP_LIMIT, default 10
        # per hour), on top of the per-user window in SubscriptionController.
        checkout_ip:
            policy: 'sliding_window'
            limit: '%env(int:CHECKOUT_IP_LIMIT)%'
            interval: '1 hour'
            cache_pool: 'cache.rate_limiter'
        # Not a limit on anything a person does: counts paid tiers granted to
        # accounts younger than a day; when more than PAID_SIGNUP_ALERT_LIMIT
        # (default 10) land in an hour, SignupAnomalyAlert mails the operator.
        paid_signup_alert:
            policy: 'sliding_window'
            limit: '%env(int:PAID_SIGNUP_ALERT_LIMIT)%'
            interval: '1 hour'
            cache_pool: 'cache.rate_limiter'
