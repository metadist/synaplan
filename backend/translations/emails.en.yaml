email:
  password_reset:
    title: 'Reset Your Password'
    intro: 'You requested to reset your password for your Synaplan account.'
    instruction: 'Click the button below to reset your password:'
    button: 'Reset Password'
    or_copy: 'Or copy and paste this link into your browser:'
    security_notice:
      title: 'Security Notice:'
      text: 'This link will expire in 1 hour. If you didn''t request this password reset, please ignore this email and your password will remain unchanged.'
  
  verification:
    title: 'Verify Your Email Address'
    intro: 'Thank you for registering with Synaplan!'
    instruction: 'Please click the button below to verify your email address:'
    button: 'Verify Email'
    or_copy: 'Or copy and paste this link into your browser:'
    expiry: 'This link will expire in 24 hours.'
    footer_notice: 'If you didn''t create an account with Synaplan, you can safely ignore this email.'
  
  welcome:
    title: 'Welcome to Synaplan!'
    greeting: 'Hi %name%,'
    intro: 'Your email has been successfully verified and your account is now active.'
    features_intro: 'You can now start using all features of Synaplan:'
    feature_1: 'AI-powered chat assistant'
    feature_2: 'Document analysis'
    feature_3: 'Multi-channel communication'
    feature_4: 'And much more!'
    button: 'Get Started'
  
  task_result:
    subject: 'Your results from Synaplan'
    subject_named: '%name% — Your results from Synaplan'
    sent_confirmation: 'Emailed the results to %email%.'

  footer:
    support: 'If you''re having trouble, please contact our support team.'
    help: 'Need help? Check out our documentation or contact support.'
    company: 'Synaplan'
    rights: 'All rights reserved'


  workspace_expiry:
    subject: 'Your file-work workspace will be deleted soon'
    body: "Your Synaplan file-work workspace has been idle for a while and will be deleted in %days% days, with the files the AI created for you. Open it before then to keep it:\n\n%url%\n\nIf you do nothing, the files will be removed and cannot be restored."

  paid_account:
    or_copy: 'Or copy this link into your browser:'
    ready:
      title: 'Your Synaplan account is ready'
      body: 'Your %plan% plan is active. Set a password to sign in on any device. The link works for 7 days; after that, use "Forgot password" on the sign-in page.'
      button: 'Set your password'
    existing:
      title: 'Your %plan% plan is on your Synaplan account'
      body: 'This email address already had a Synaplan account, so the %plan% plan was added to it. Sign in as usual to use it.'
      button: 'Sign in'

  login_link:
    title: 'Your sign-in link for Synaplan'
    body: 'Use this button to sign in. It works once, for 15 minutes.'
    button: 'Sign in'
    or_copy: 'Or copy this link into your browser:'
    not_you: 'If you did not ask for this, ignore this mail; nobody can sign in without the link.'

  code_signup:
    title: 'Your invitation to Synaplan'
    body: 'Use this button to continue. It works once, for 15 minutes. Your account is created when you open it, unless this address already has one.'
    button: 'Continue'
    or_copy: 'Or copy this link into your browser:'
    not_you: 'If you did not ask for this, ignore this mail; nobody can open an account without the link.'
