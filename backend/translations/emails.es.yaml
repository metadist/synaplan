email:
  password_reset:
    title: 'Restablecer su contraseña'
    intro: 'Ha solicitado restablecer la contraseña de su cuenta de Synaplan.'
    instruction: 'Haga clic en el botón de abajo para restablecer su contraseña:'
    button: 'Restablecer contraseña'
    or_copy: 'O copie y pegue este enlace en su navegador:'
    security_notice:
      title: 'Aviso de seguridad:'
      text: 'Este enlace caducará en 1 hora. Si no ha solicitado este restablecimiento de contraseña, ignore este correo y su contraseña permanecerá sin cambios.'

  verification:
    title: 'Verifique su dirección de correo electrónico'
    intro: '¡Gracias por registrarse en Synaplan!'
    instruction: 'Haga clic en el botón de abajo para verificar su dirección de correo electrónico:'
    button: 'Verificar correo'
    or_copy: 'O copie y pegue este enlace en su navegador:'
    expiry: 'Este enlace caducará en 24 horas.'
    footer_notice: 'Si no ha creado una cuenta en Synaplan, puede ignorar este correo con tranquilidad.'

  welcome:
    title: '¡Bienvenido a Synaplan!'
    greeting: 'Hola %name%:'
    intro: 'Su correo electrónico se ha verificado correctamente y su cuenta ya está activa.'
    features_intro: 'Ya puede empezar a usar todas las funciones de Synaplan:'
    feature_1: 'Asistente de chat con IA'
    feature_2: 'Análisis de documentos'
    feature_3: 'Comunicación multicanal'
    feature_4: '¡Y mucho más!'
    button: 'Comenzar'

  task_result:
    subject: 'Sus resultados de Synaplan'
    subject_named: '%name% — Sus resultados de Synaplan'
    sent_confirmation: 'Los resultados se han enviado por correo a %email%.'

  footer:
    support: 'Si tiene problemas, póngase en contacto con nuestro equipo de soporte.'
    help: '¿Necesita ayuda? Consulte nuestra documentación o contacte con el soporte.'
    company: 'Synaplan'
    rights: 'Todos los derechos reservados'

  workspace_expiry:
    subject: 'Tu espacio de trabajo se eliminará pronto'
    body: "Tu espacio de trabajo de Synaplan lleva tiempo sin usarse y se eliminará en %days% días, junto con los archivos que la IA creó para ti. Ábrelo antes para conservarlo:\n\n%url%\n\nSi no haces nada, los archivos se eliminarán sin posibilidad de recuperarlos."

  paid_account:
    or_copy: 'O copia este enlace en tu navegador:'
    ready:
      title: 'Tu cuenta de Synaplan está lista'
      body: 'Tu plan %plan% está activo. Crea una contraseña para iniciar sesión en cualquier dispositivo. El enlace es válido durante 7 días; después, usa "¿Olvidaste tu contraseña?" en la página de inicio de sesión.'
      button: 'Crear contraseña'
    existing:
      title: 'Tu plan %plan% está en tu cuenta de Synaplan'
      body: 'Esta dirección de correo ya tenía una cuenta de Synaplan, así que el plan %plan% se añadió a ella. Inicia sesión como siempre para usarlo.'
      button: 'Iniciar sesión'

  login_link:
    title: 'Tu enlace de inicio de sesión de Synaplan'
    body: 'Usa este botón para iniciar sesión. Funciona una vez, durante 15 minutos.'
    button: 'Iniciar sesión'
    or_copy: 'O copia este enlace en tu navegador:'
    not_you: 'Si no lo has pedido, ignora este correo; nadie puede iniciar sesión sin el enlace.'
