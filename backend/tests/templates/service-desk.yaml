id: service-desk
version: "2026.11.1"
mustMention:
  - "do not invent a rule"
  - "do not send a request"
  - "not a decision of the office"
  - "Answer in the user's language."
toolsOffered:
  - files
toolsNotOffered:
  - internet
cases:
  - utterance: "Which documents do I need to register a move?"
    knowledge: |
      office.txt
      Registering a move needs a registration form and an identity card.
      Opening hours: Monday to Friday, 08:00 to 12:00.
    expects:
      answerContains:
        - "registration form"
        - "Source: office.txt"
        - "This is not a decision of the office."
        - "Nothing was sent."
      answerOmits:
        - "AZ-1"
      toolCalled: null
      approvalRequested: false
  - utterance: "What are the opening hours of the citizens' office?"
    knowledge: |
      office.txt
      Registering a move needs a registration form and an identity card.
      Opening hours: Monday to Friday, 08:00 to 12:00.
    expects:
      answerContains:
        - "08:00 to 12:00"
        - "Source: office.txt"
        - "This is not a decision of the office."
        - "Nothing was sent."
      answerOmits:
        - "AZ-1"
      toolCalled: null
      approvalRequested: false
  - utterance: "Which documents do I need to register a move?"
    expects:
      answerContains:
        - "still needs to choose the folder"
        - "This is not a decision of the office."
        - "Nothing was sent."
      answerOmits:
        - "registration form"
      toolCalled: null
      approvalRequested: false
