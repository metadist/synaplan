# Compute nightly load (CS26): T1 on GitHub-hosted runners, T2 behind a flag.
#
# T1 builds everything from source (sidecar + run images), pushes the run
# images to an ephemeral local registry for real RepoDigests, starts the
# sidecar with the docker socket, and runs the mixed load scenario. The
# registry dance stands in for the compute v1.x release (which publishes
# real digests); until then run-image refs stay placeholders in the tree.
#
# T2 needs a self-hosted gVisor runner that does not exist yet: the job only
# runs when the repo variable COMPUTE_T2_NIGHTLY_ENABLED is 'true'.
name: Compute nightly load

permissions:
  contents: read

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  load-t1:
    name: Load mix on T1 (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sidecars/synaplan-compute
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sidecars/synaplan-compute/go.mod
          cache-dependency-path: sidecars/synaplan-compute/go.sum

      - name: Build run images
        run: make images

      - name: Push run images to a local registry (real digests)
        run: |
          set -euo pipefail
          docker run -d --name nightly-registry -p 127.0.0.1:5000:5000 registry:2.8
          for img in python node; do
            docker tag "synaplan-compute-$img:latest" "127.0.0.1:5000/compute-$img:latest"
            docker push "127.0.0.1:5000/compute-$img:latest"
          done
          pyid=$(docker inspect --format '{{index .RepoDigests 0}}' 127.0.0.1:5000/compute-python:latest | sed 's/.*@//')
          nodeid=$(docker inspect --format '{{index .RepoDigests 0}}' 127.0.0.1:5000/compute-node:latest | sed 's/.*@//')
          python3 - "$pyid" "$nodeid" << 'EOF'
          import re, sys
          pyid, nodeid = sys.argv[1], sys.argv[2]
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', pyid), pyid
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', nodeid), nodeid
          p = 'internal/images/map.go'
          text = open(p).read()
          text = re.sub(r'"ghcr\.io/metadist/synaplan-compute-python@sha256:" \+ strings\.Repeat\("a", 64\)',
                        f'"127.0.0.1:5000/compute-python@{pyid}"', text)
          text = re.sub(r'"ghcr\.io/metadist/synaplan-compute-node@sha256:" \+ strings\.Repeat\("b", 64\)',
                        f'"127.0.0.1:5000/compute-node@{nodeid}"', text)
          open(p, 'w').write(text)
          print('pinned map to registry digests')
          EOF
          grep -n "127.0.0.1:5000/compute-python@sha256:" internal/images/map.go | head -1

      - name: Build and start sidecar
        run: |
          set -euo pipefail
          docker build -t synaplan-compute:test .
          mkdir -p /tmp/compute-nightly/scratch /tmp/compute-nightly/workspaces
          chmod 777 /tmp/compute-nightly/scratch /tmp/compute-nightly/workspaces
          token=$(openssl rand -hex 32)
          echo "COMPUTE_TOKEN=$token" >> "$GITHUB_ENV"
          docker run -d --name synaplan-compute-nightly \
            -p 127.0.0.1:8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/compute-nightly/scratch:/scratch \
            -v /tmp/compute-nightly/workspaces:/workspaces \
            -e COMPUTE_AUTH_TOKEN="$token" \
            -e COMPUTE_LISTEN=:8080 \
            -e COMPUTE_MAX_CONCURRENT=4 \
            synaplan-compute:test
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/v1/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/v1/health | head -c 300
          echo

      - name: Run load mix (N=32, concurrency 4)
        run: go run ./cmd/compute-load -url http://127.0.0.1:8080 -n 32 -concurrency 4

      - name: Show sidecar logs on failure
        if: failure()
        run: docker logs synaplan-compute-nightly 2>&1 | tail -40

  load-t2:
    name: Load mix on T2 (gVisor)
    if: vars.COMPUTE_T2_NIGHTLY_ENABLED == 'true'
    runs-on: [self-hosted, gvisor]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sidecars/synaplan-compute
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sidecars/synaplan-compute/go.mod
          cache-dependency-path: sidecars/synaplan-compute/go.sum

      - name: Build run images
        run: make images

      - name: Push run images to a local registry (real digests)
        run: |
          set -euo pipefail
          docker run -d --name nightly-registry -p 127.0.0.1:5000:5000 registry:2.8
          for img in python node; do
            docker tag "synaplan-compute-$img:latest" "127.0.0.1:5000/compute-$img:latest"
            docker push "127.0.0.1:5000/compute-$img:latest"
          done
          pyid=$(docker inspect --format '{{index .RepoDigests 0}}' 127.0.0.1:5000/compute-python:latest | sed 's/.*@//')
          nodeid=$(docker inspect --format '{{index .RepoDigests 0}}' 127.0.0.1:5000/compute-node:latest | sed 's/.*@//')
          python3 - "$pyid" "$nodeid" << 'EOF'
          import re, sys
          pyid, nodeid = sys.argv[1], sys.argv[2]
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', pyid), pyid
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', nodeid), nodeid
          text = open('internal/images/map.go').read()
          text = re.sub(r'"ghcr\.io/metadist/synaplan-compute-python@sha256:" \+ strings\.Repeat\("a", 64\)',
                        f'"127.0.0.1:5000/compute-python@{pyid}"', text)
          text = re.sub(r'"ghcr\.io/metadist/synaplan-compute-node@sha256:" \+ strings\.Repeat\("b", 64\)',
                        f'"127.0.0.1:5000/compute-node@{nodeid}"', text)
          open('internal/images/map.go', 'w').write(text)
          print('pinned map to registry digests')
          EOF

      - name: Build and start sidecar (gVisor tier)
        run: |
          set -euo pipefail
          docker build -t synaplan-compute:test .
          mkdir -p /tmp/compute-nightly/scratch /tmp/compute-nightly/workspaces
          chmod 777 /tmp/compute-nightly/scratch /tmp/compute-nightly/workspaces
          token=$(openssl rand -hex 32)
          echo "COMPUTE_TOKEN=$token" >> "$GITHUB_ENV"
          docker run -d --name synaplan-compute-nightly \
            -p 127.0.0.1:8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/compute-nightly/scratch:/scratch \
            -v /tmp/compute-nightly/workspaces:/workspaces \
            -e COMPUTE_AUTH_TOKEN="$token" \
            -e COMPUTE_LISTEN=:8080 \
            -e COMPUTE_TIER=gvisor \
            -e COMPUTE_MAX_CONCURRENT=4 \
            synaplan-compute:test
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/v1/health && break
            sleep 2
          done

      - name: Run load mix (N=32, concurrency 4)
        run: go run ./cmd/compute-load -url http://127.0.0.1:8080 -n 32 -concurrency 4

      - name: Show sidecar logs on failure
        if: failure()
        run: docker logs synaplan-compute-nightly 2>&1 | tail -40
