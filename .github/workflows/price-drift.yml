name: Price Drift Check

# Daily guard that flags when a provider has changed prices upstream while our
# ModelCatalog.php still holds the old value. It runs `app:sync-model-prices
# --dry-run --fail-on-drift`, which reports drift for per-token models AND for
# media/audio models whose pricing mode matches upstream, resolution tiers
# included. The #1318 mode guard only blocks the automatic WRITE for those rows,
# it never suppresses the detection; what it does exclude is a structural
# `pricing_mode` mismatch, which is listed in the report but never fails the run
# because the two sides measure different things and can never reconcile.
#
# The same job then runs `app:models:discover --fail-on-new` against OpenRouter's
# public model list (hint source only) to surface newly listed first-party models
# our catalog does not carry yet. Discovery is informational: the step always
# exits 0 and reports via outputs; new findings open a separate GitHub issue.
#
# Every run posts its report to Discord (#report-logs) so the channel carries a
# daily record. On drift it also opens (or comments on) a GitHub issue so a human
# can verify against the official price page and update the catalog; an unchanged
# drift is not re-commented. This is informational — it deliberately lives
# OUTSIDE the PR CI because it depends on an external source (LiteLLM) that
# changes independently of our code.

on:
  schedule:
    - cron: "0 6 * * *" # every day 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Detect model price drift
    runs-on: ubuntu-latest

    env:
      DATABASE_WRITE_URL: mysql://synaplan_test:synaplan_test@127.0.0.1:3306/synaplan?serverVersion=mariadb-12.2.2&charset=utf8mb4
      DATABASE_READ_URL: mysql://synaplan_test:synaplan_test@127.0.0.1:3306/synaplan?serverVersion=mariadb-12.2.2&charset=utf8mb4

    services:
      mysql:
        image: mariadb:13.0@sha256:d4fdec0510ad498e4f3127da30a99df3745bd6d5e611ae6ac5f76403d9284a8d
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: synaplan_test
          MYSQL_USER: synaplan_test
          MYSQL_PASSWORD: synaplan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, zip, gd, curl, bcmath, exif, pcntl, opcache, readline, soap, sodium, ffi, imagick, grpc, redis
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install protoc from base image
        run: |
          BASE_IMAGE=$(grep -oP 'FROM \K\S+' _docker/backend/Dockerfile | head -1)
          id=$(docker create "$BASE_IMAGE")
          trap 'docker rm "$id"' EXIT
          sudo docker cp "$id":/usr/local/bin/protoc /usr/local/bin/protoc
          protoc --version

      - name: Create .env file
        working-directory: backend
        run: cp .env.test .env

      - name: Create plugins symlink
        run: sudo ln -s ${{ github.workspace }}/plugins /plugins

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup database schema
        working-directory: backend
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Seed catalogs (models, prompts, defaults, rate limits)
        working-directory: backend
        run: php bin/console app:seed --no-interaction

      - name: Check for price drift
        id: drift
        working-directory: backend
        env:
          # Symfony's Terminal reads COLUMNS, and SymfonyStyle caps a block at its
          # own MAX_LINE_LENGTH of 120. Without this the report wraps at the CI
          # default of 80 and every model line breaks mid-sentence.
          COLUMNS: 120
        run: |
          set +e
          php bin/console app:sync-model-prices --dry-run --fail-on-drift 2>&1 | tee drift-report.txt
          code=${PIPESTATUS[0]}

          # Just the models a human has to act on: drifted rows, plus obsolete
          # LITELLM_DEVIATIONS entries (LiteLLM adopted the catalog value, so the
          # registry entry must go — the run stays green, so this field is the
          # only place anyone sees it). The mode-mismatch, unmatched and
          # known-deviation sections are steady state (they are reported every
          # single run), so they stay out of both the Discord field and the change
          # signature below. Section titles come from SyncModelPricesCommand.
          awk '
            /^Non-per-token price drift|^Obsolete LiteLLM deviations/ { section = 1; next }
            /^Pricing-mode mismatch|^Unmatched|^Null-price protected|^Known LiteLLM deviations/ { section = 0 }
            section && /^ \* / { print }
            /\[DRY-RUN\]/ { print }
          ' drift-report.txt > drift-flagged.txt

          # The counter block, which SymfonyStyle wraps over several lines at 120
          # chars. Kept verbatim rather than re-joined: Discord renders it in a code
          # block where the wrapping is harmless.
          awk '/Price sync complete:/ { found = 1 } found { print; if (/unmatched/) exit }' \
            drift-report.txt > drift-summary.txt

          {
            echo "exit_code=$code"
            # Order-independent hash of the flagged set, with no timestamp in it,
            # so a daily run can tell "same drift as yesterday" from "new drift".
            echo "signature=$(sort drift-flagged.txt | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

          exit "$code"

      - name: Check for new upstream models
        id: discover
        if: always()
        working-directory: backend
        env:
          # Same COLUMNS rationale as the drift step — SymfonyStyle wraps at 120.
          COLUMNS: 120
        run: |
          set +e
          php bin/console app:models:discover --fail-on-new 2>&1 | tee discover-report.txt
          code=${PIPESTATUS[0]}

          # Just the new-model bullet lines (SymfonyStyle listing prefix " * ").
          # Section title comes from DiscoverModelsCommand.
          awk '
            /^New upstream models/ { section = 1; next }
            /^Ignored |^Obsolete ignore entries/ { section = 0 }
            section && /^ \* / { print }
          ' discover-report.txt > discover-flagged.txt

          {
            echo "exit_code=$code"
            # Order-independent hash of the new-model set, so a daily run can tell
            # "same findings as yesterday" from "a different set to review".
            echo "signature=$(sort discover-flagged.txt | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

          # Informational only — outcome travels via outputs; never fail the job.
          exit 0

      # Daily record of the check in #report-logs, drift or not. Runs even when a
      # setup step above broke, because a monitor that silently stops reporting is
      # worse than a noisy one. Optional: no webhook configured → no post.
      - name: Report to Discord
        if: always()
        env:
          HOOK: ${{ secrets.DISCORD_REPORT_LOGS_WEBHOOK }}
          CODE: ${{ steps.drift.outputs.exit_code }}
          DISCOVER_CODE: ${{ steps.discover.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "${HOOK:-}" ] || exit 0

          case "${CODE:-}" in
            0) title="✅ No model price drift"; colour=3066993 ;;
            2) title="⚠️ Model price drift detected"; colour=16776960 ;;
            *) title="❌ Price drift check could not run"; colour=15158332 ;;
          esac

          # When drift is clean but discovery found models to review, keep the
          # drift title and append a review hint; yellow draws the eye without
          # pretending prices drifted.
          if [ "${DISCOVER_CODE:-}" = "2" ] && [ "${CODE:-}" = "0" ]; then
            new_count=$(grep -c '^ \* ' backend/discover-flagged.txt 2>/dev/null || true)
            new_count=${new_count:-0}
            if [ "$new_count" -gt 0 ]; then
              title="${title} · ${new_count} new model(s) to review"
              colour=16776960
            fi
          elif [ "${DISCOVER_CODE:-}" != "0" ] && [ "${CODE:-}" = "0" ]; then
            title="${title} · new-model check could not run"
            colour=16776960
          fi

          summary="$(cat backend/drift-summary.txt 2>/dev/null || true)"
          [ -n "$summary" ] || summary="No report produced — the check broke before it could compare prices."

          flagged="$(cat backend/drift-flagged.txt 2>/dev/null || true)"
          [ -n "$flagged" ] || flagged="none"

          # Only exit 0 means "nothing new"; any other code (a PHP fatal after a
          # broken setup, a skipped step) must never read as an all-clear.
          case "${DISCOVER_CODE:-}" in
            0) new_models="none" ;;
            1) new_models="Could not check — OpenRouter list unavailable" ;;
            2)
              new_models="$(cat backend/discover-flagged.txt 2>/dev/null || true)"
              [ -n "$new_models" ] || new_models="none"
              ;;
            *) new_models="Could not check — the discovery step did not finish (see the run log)" ;;
          esac

          # Match DiscordNotificationService embed shape (title/fields/footer/timestamp).
          # Field values max 1024; the full report stays in the run log and, on
          # drift, in the GitHub issue.
          payload="$(jq -n \
            --arg title "$title" \
            --arg summary "$summary" \
            --arg flagged "$flagged" \
            --arg new_models "$new_models" \
            --arg run "$RUN_URL" \
            --argjson colour "$colour" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: $title,
                color: $colour,
                fields: [
                  { name: "Summary", value: ("```\n" + ($summary | .[0:900]) + "\n```"), inline: false },
                  { name: "Flagged models", value: ("```\n" + ($flagged | .[0:900]) + "\n```"), inline: false },
                  { name: "New models", value: ("```\n" + ($new_models | .[0:900]) + "\n```"), inline: false },
                  { name: "Workflow", value: ("[Open run](" + $run + ")"), inline: true }
                ],
                footer: { text: "Synaplan price drift" },
                timestamp: $ts
              }]
            }')"

          curl --fail-with-body --silent --show-error --retry 3 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$HOOK" \
            || echo "::warning::Discord notification failed"

      - name: Open or update drift issue
        if: failure() && steps.drift.outputs.exit_code == '2'
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNATURE: ${{ steps.drift.outputs.signature }}
        run: |
          TITLE="Price drift detected — verify against official provider pages"
          {
            echo "The daily price-drift check found models whose price differs from the LiteLLM database. A difference is a signal to verify, not a value to copy — LiteLLM has been wrong before (Veo 3.1 Fast, Jina rerank)."
            echo ""
            echo "**What to do:** for every model in the \`[DRY-RUN]\` lines and the \`Non-per-token price drift\` section, open the official provider price page (the \`source:\` URL on the line is LiteLLM's own reference) and decide which side is right. Provider changed the price → correct \`backend/src/Model/ModelCatalog.php\` and ship a fingerprint-preserving data migration. LiteLLM is wrong → record it in \`ModelCatalog::LITELLM_DEVIATIONS\` and file the fix upstream. The step-by-step procedure, including the STOP conditions, is \`docs/PRICE_DRIFT_PROCEDURE.md\` (background: \`docs/PRICING_MAINTENANCE.md\`)."
            echo ""
            echo "_Nothing is auto-written: the catalog is the source of truth. \`Known LiteLLM deviations\`, \`Pricing-mode mismatch\` and \`Unmatched\` are steady-state sections that never fail the check; an \`Obsolete LiteLLM deviations\` section means LiteLLM fixed a value and the registry entry can be deleted._"
            echo ""
            echo "<details><summary>Dry-run report ($(date -u +%Y-%m-%dT%H:%MZ))</summary>"
            echo ""
            echo '```'
            cat drift-report.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "<!-- drift-signature: $SIGNATURE -->"
          } > drift-body.md

          EXISTING=$(gh issue list --state open --search "in:title \"Price drift detected\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            # The check runs daily now, so an unresolved drift would otherwise
            # stack one identical comment per day. Only report again once the set
            # of flagged models actually changes.
            if gh issue view "$EXISTING" --json body,comments \
                 --jq '[.body] + [.comments[].body] | join("\n")' \
                 | grep -qF "drift-signature: $SIGNATURE"; then
              echo "Same flagged models as the last report on #$EXISTING — not commenting again."
              exit 0
            fi
            echo "Commenting on existing drift issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file drift-body.md
          else
            echo "Opening new drift issue"
            gh issue create --title "$TITLE" --label "prio:2" --body-file drift-body.md
          fi

      - name: Open or update new-models issue
        if: always() && steps.discover.outputs.exit_code == '2'
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNATURE: ${{ steps.discover.outputs.signature }}
        run: |
          TITLE="New AI models not in the catalog — review"
          {
            echo "The daily model-discovery check found first-party models on OpenRouter that \`ModelCatalog\` does not carry yet. OpenRouter is a **hint source only** — a reseller list, never a price authority. Its ids and own variants can differ from what the provider serves."
            echo ""
            echo "**What to do:** for every model under \`New upstream models\`,"
            echo "1. Verify it on the **official provider price page** (see Maintenance links in \`docs/PRICING_MAINTENANCE.md\`)."
            echo "2. If we should offer it: add catalog rows + tests (example: https://github.com/metadist/synaplan/pull/2157)."
            echo "3. If it is an OpenRouter-only variant or otherwise out of scope: add a reasoned entry to \`ModelDiscoveryIgnoreList\` (exact OpenRouter id, reason, \`decidedOn\`)."
            echo ""
            echo "_Nothing is auto-written. Obsolete ignore entries in the report mean delete those keys from the ignore list._"
            echo ""
            echo "<details><summary>Discovery report ($(date -u +%Y-%m-%dT%H:%MZ))</summary>"
            echo ""
            echo '```'
            cat discover-report.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "<!-- discovery-signature: $SIGNATURE -->"
          } > discover-body.md

          EXISTING=$(gh issue list --state open --search "in:title \"New AI models not in the catalog\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            if gh issue view "$EXISTING" --json body,comments \
                 --jq '[.body] + [.comments[].body] | join("\n")' \
                 | grep -qF "discovery-signature: $SIGNATURE"; then
              echo "Same new models as the last report on #$EXISTING — not commenting again."
              exit 0
            fi
            echo "Commenting on existing new-models issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file discover-body.md
          else
            echo "Opening new new-models issue"
            gh issue create --title "$TITLE" --label "prio:2" --body-file discover-body.md
          fi
