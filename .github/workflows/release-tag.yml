name: Cut Release Tag

# Cuts a release tag for `main` on request and prepares a DRAFT GitHub release
# with generated notes. The tag alone only feeds the platform release jobs
# (Docker images, version pins); the mobile release chain in
# metadist/synaplan-apps starts when the draft release is PUBLISHED
# (`mobile-release-artifacts.yml`). release-publish.yml raises that signal on
# its own, the moment this tag's CI run goes green — see that workflow for why
# publishing is automatic rather than a manual click.
#
# The mobile classification is computed here purely as information for the
# summary — it no longer gates the tag, because the authoritative
# classification happens at publish time against the previously published
# release.
#
# By default the tip of the default branch is released. The `commit` input
# selects an earlier commit on that branch, for when the tip carries work that
# should not ship yet.
#
# The version level comes from the `bump` input. "auto" (the default) reads the
# commit types between the previous release and this one: any commit whose
# subject STARTS with `feat` raises the minor version, everything else raises
# the patch version. Only the start matters and the casing does not, so `feat:`,
# `feat(chat):` and the `Feat/desktop client` shape a squash-merged PR title
# takes all count — see scripts/next-release-tag.mjs and its tests for the
# exact rules. A major version is never automatic; select `bump: major`
# deliberately when a release should be one. A `BREAKING CHANGE:` footer or
# `feat!:` marker is called out in the step summary instead of silently
# becoming a major bump.
#
# The tag is created through a GitHub App installation token on purpose. Refs
# created with the default GITHUB_TOKEN do not start new workflow runs, so the
# tag would never reach CI and the platform release jobs would not run.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Version level. "auto" reads the commits since the last release: any
          commit starting with "feat" raises the minor version, everything else
          the patch version. A major version is never automatic — select it
          here.
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      commit:
        description: Commit on the default branch to release, or empty for its tip
        required: false
        default: ''
        type: string
      dry_run:
        description: Only report the classification and the tag that would be created
        required: false
        default: false
        type: boolean

concurrency:
  group: mobile-release-tag
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  tag:
    name: Tag a mobile-relevant main commit
    runs-on: ubuntu-latest
    env:
      # The dispatch API only accepts a branch or tag as `ref`, so an older
      # commit is selected through an input rather than through the ref. The
      # workflow and the classifier therefore always run from the default
      # branch, and the selected commit stays data.
      HEAD_SHA: ${{ inputs.commit || github.sha }}
      BUMP: ${{ inputs.bump || 'auto' }}
    steps:
      - name: Check tagging credentials
        id: config
        env:
          APP_ID: ${{ secrets.MOBILE_TAG_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.MOBILE_TAG_APP_PRIVATE_KEY }}
        run: |
          if test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing credentials
        if: steps.config.outputs.configured == 'false'
        run: |
          echo "Tagging is inactive because the GitHub App credentials are not configured." |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The tag is created through the API, so no writable token belongs in
          # .git/config.
          persist-credentials: false

      - name: Require the default branch
        if: steps.config.outputs.configured == 'true'
        env:
          SELECTED: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$SELECTED" != "$DEFAULT" ]; then
            echo "::error::A release is cut from ${DEFAULT}, not from ${SELECTED}."
            exit 1
          fi

      - name: Require a commit on the default branch
        if: steps.config.outputs.configured == 'true' && inputs.commit != ''
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Select a commit by its full 40-character SHA, not by ${HEAD_SHA}."
            exit 1
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Commit ${HEAD_SHA} does not exist in this repository."
            exit 1
          fi
          # HEAD is the tip of the default branch, because the step above
          # refuses every other ref.
          if ! git merge-base --is-ancestor "$HEAD_SHA" HEAD; then
            echo "::error::Commit ${HEAD_SHA} is not part of ${DEFAULT} — refusing to release an unreviewed commit."
            exit 1
          fi

      - name: Require a green commit
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The previous workflow_run trigger guaranteed this implicitly. Started
          # by hand, nothing stops a release from a red commit, so verify that
          # this exact commit passed CI on a branch push. The API filters on
          # head_sha, but it ignores an unknown query parameter silently, so the
          # commit is matched again on the returned runs.
          green="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&status=success&per_page=100" |
              jq --arg sha "$HEAD_SHA" \
                '[.workflow_runs[] | select(.name == "CI" and .event == "push" and .head_sha == $sha)] | length'
          )"
          if [ "$green" -eq 0 ]; then
            echo "::error::No successful CI run exists for ${HEAD_SHA} — refusing to release an unverified commit."
            exit 1
          fi

      - name: Classify the release
        if: steps.config.outputs.configured == 'true'
        id: classify
        run: |
          set -euo pipefail
          # Only a release tag blocks a new one. Any other ref pointing at the
          # commit (a nightly or environment tag, say) must not suppress it.
          existing_release_tag=''
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              existing_release_tag="$candidate"
              break
            fi
          done < <(git tag --points-at "$HEAD_SHA" --list 'v*')
          if [ -n "$existing_release_tag" ]; then
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
            echo "reason=The commit already carries the release tag \`${existing_release_tag}\`." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_tag=''
          while IFS= read -r candidate; do
            previous_tag="$candidate"
            break
          done < <(git tag --merged "$HEAD_SHA" --list 'v*' --sort=-version:refname)
          base_ref="${previous_tag:-$(git rev-list --max-parents=0 "$HEAD_SHA")}"
          # The classification is informational only: it previews the mobile
          # route, but the tag is always created. The binding classification is
          # computed by mobile-release-artifacts.yml when the release is
          # published, against the previously PUBLISHED release.
          node scripts/mobile-impact.mjs \
            --base "$base_ref" \
            --head "$HEAD_SHA" \
            --output mobile-impact-manifest.json
          classification="$(jq -r '.classification' mobile-impact-manifest.json)"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "previous=${previous_tag:-none}" >> "$GITHUB_OUTPUT"
          echo "needs_tag=true" >> "$GITHUB_OUTPUT"

          # The version level: "auto" reads the Conventional Commits between
          # the previous release and this one; an explicit `bump` overrides it
          # outright. Never resolves to "major" on its own — see
          # next-release-tag.mjs.
          node scripts/next-release-tag.mjs \
            --bump "$BUMP" \
            --base "$base_ref" \
            --head "$HEAD_SHA" \
            --json > release-plan.json
          echo "tag=$(jq -r '.tag' release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "level=$(jq -r '.level' release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "requested=$(jq -r '.requested' release-plan.json)" >> "$GITHUB_OUTPUT"
          # The full classification (features/breaking/unconventional commits)
          # for the summary step below, carried through as one compact JSON
          # line — a step output cannot hold a multi-line value.
          echo "plan=$(jq -c '.' release-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Report the plan
        if: steps.classify.outputs.needs_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.classify.outputs.tag }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          PREVIOUS: ${{ steps.classify.outputs.previous }}
          LEVEL: ${{ steps.classify.outputs.level }}
          REQUESTED: ${{ steps.classify.outputs.requested }}
          PLAN: ${{ steps.classify.outputs.plan }}
        run: |
          set -euo pipefail
          {
            echo "Release \`$RELEASE_TAG\` tags \`${HEAD_SHA}\` and collects everything since \`$PREVIOUS\`."
            echo ""

            feature_count="$(printf '%s' "$PLAN" | jq '.features | length')"
            commit_count="$(printf '%s' "$PLAN" | jq '.commits')"
            breaking_count="$(printf '%s' "$PLAN" | jq '.breaking | length')"
            unconventional_count="$(printf '%s' "$PLAN" | jq '.unconventional | length')"

            if [ "$REQUESTED" = auto ]; then
              if [ "$LEVEL" = minor ]; then
                echo "Version \`$RELEASE_TAG\` raises the minor version: ${feature_count} of ${commit_count} commits since \`$PREVIOUS\` start with \`feat\`."
              else
                echo "Version \`$RELEASE_TAG\` raises the patch version: none of the ${commit_count} commits since \`$PREVIOUS\` start with \`feat\`."
              fi
            else
              echo "Version \`$RELEASE_TAG\` raises the ${LEVEL} version because \`bump: ${REQUESTED}\` was requested."
            fi

            # A breaking-change marker never raises the version on its own —
            # see next-release-tag.mjs — so it is surfaced here instead, with
            # the explicit next step to raise it deliberately.
            if [ "$breaking_count" -gt 0 ] && [ "$LEVEL" != major ]; then
              echo ""
              echo "**Breaking-change marker(s) found, but the major version was not raised.** Re-run with \`bump: major\` if this release should be one:"
              printf '%s' "$PLAN" | jq -r '.breaking[] | "- `" + . + "`"'
            fi

            if [ "$unconventional_count" -gt 0 ]; then
              echo ""
              echo "${unconventional_count} commit(s) do not start with a known commit type and could not be classified for \`bump: auto\`:"
              printf '%s' "$PLAN" | jq -r '.unconventional[] | "- `" + . + "`"'
            fi

            echo ""
            case "$CLASSIFICATION" in
              ota-candidate) route='ships over the air once the draft release is published' ;;
              store-required) route='builds a store release candidate once the draft release is published' ;;
              *) route='does not reach the app; publishing the draft release only records the platform version' ;;
            esac
            echo "Mobile classification preview since the last tag: \`$CLASSIFICATION\` — ${route}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create tagging token
        if: steps.classify.outputs.needs_tag == 'true' && !inputs.dry_run
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MOBILE_TAG_APP_ID }}
          private-key: ${{ secrets.MOBILE_TAG_APP_PRIVATE_KEY }}

      - name: Create the release tag
        if: steps.classify.outputs.needs_tag == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.classify.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_TAG}" \
            -f "sha=${HEAD_SHA}"
          echo "Tagged \`${HEAD_SHA}\` as \`${RELEASE_TAG}\`." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create the draft release
        if: steps.classify.outputs.needs_tag == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.classify.outputs.tag }}
        run: |
          set -euo pipefail
          # Publishing this draft starts mobile-release-artifacts.yml, which
          # classifies everything since the previously published release and
          # routes it (OTA, store, or nothing). release-publish.yml does the
          # publishing on its own once CI for this tag is green; nobody needs
          # to click anything for the chain to continue.
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Synaplan ${RELEASE_TAG}"
          echo "Draft release \`${RELEASE_TAG}\` created — release-publish.yml publishes it automatically once CI for this tag is green." |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report a dry run
        if: steps.classify.outputs.needs_tag == 'true' && inputs.dry_run
        run: echo "Dry run — no tag and no draft release were created." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report skipped tag
        if: steps.classify.outputs.needs_tag == 'false'
        env:
          REASON: ${{ steps.classify.outputs.reason }}
        run: echo "No release tag was created. $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
