name: AWS Marketplace AMI

# Builds the AMI that AWS Marketplace publishes, for both architectures.
#
# Not part of CI: it costs EC2 instance hours and it may only ever bake a
# release whose container images are already published and verified. Release
# tags therefore trigger it, and it waits for the images to exist before Packer
# starts. Run it by hand to rebuild an older release, or to try a change without
# tagging — from any branch of this repository, so a deployment fix can be built
# and verified from its pull request before it is merged. The AWS trust policy
# allows that because the jobs below declare the ami-build environment; see
# deploy/aws/cloudformation/marketplace-roles.yaml.
#
# Authentication is GitHub OIDC against a role in the seller account. There are
# no long-lived AWS keys in this repository, and there must never be.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to bake in, without a leading v (for example 4.0.16).'
        required: true
        type: string
      architecture:
        description: 'Which image to build.'
        required: true
        default: both
        type: choice
        options: [both, x86_64, arm64]
      verify:
        description: 'Launch the x86_64 AMI through CloudFormation and smoke-test it. Costs a few cents of instance time.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aws-ami-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Marketplace ingests from us-east-1 only; other regions are produced by
  # copying the published AMI.
  AWS_REGION: us-east-1
  AWS_MARKETPLACE_INGESTION_ACCOUNT_ID: '679593333241'
  IMAGE_REPOSITORY: ghcr.io/metadist/synaplan

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
      configured: ${{ steps.credentials.outputs.configured }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version and architectures
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARCHITECTURE: ${{ inputs.architecture || 'both' }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi

          # An AMI is immutable once published and customers launch it for
          # years, so it may only ever bake an immutable tag. `latest` here
          # would produce an image whose contents nobody can reconstruct.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${GITHUB_REF_NAME} is not a plain release; no AMI is built."
            echo "version=" >> "$GITHUB_OUTPUT"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$INPUT_ARCHITECTURE" in
            x86_64) matrix='["x86_64"]' ;;
            arm64)  matrix='["arm64"]' ;;
            *)      matrix='["x86_64","arm64"]' ;;
          esac

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Building the AMI for ${version} (${matrix})." >> "$GITHUB_STEP_SUMMARY"

      # The seller account is the manager's to create, and until it exists this
      # workflow has nothing to authenticate against. Reported as skipped rather
      # than failed, so a release run stays green while the account is pending.
      - name: Check the AWS role
        id: credentials
        env:
          ROLE: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
        run: |
          if [ -n "${ROLE:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No \`AWS_AMI_BUILD_ROLE_ARN\` secret; the AMI build is skipped." |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Packer bakes these images into the AMI. A release tag reaches this
      # workflow the moment it is pushed, while CI is still building and pushing
      # them, so waiting is the difference between a correct AMI and a failed —
      # or worse, a stale — build.
      - name: Wait for the published container images
        if: steps.version.outputs.version != '' && steps.credentials.outputs.configured == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker manifest inspect "${IMAGE_REPOSITORY}:${VERSION}" >/dev/null 2>&1; then
              echo "${IMAGE_REPOSITORY}:${VERSION} is published."
              exit 0
            fi
            echo "Attempt ${attempt}: ${IMAGE_REPOSITORY}:${VERSION} is not published yet; waiting."
            sleep 60
          done
          echo "::error::${IMAGE_REPOSITORY}:${VERSION} was never published; refusing to bake an AMI without it."
          exit 1

  build:
    name: Build the AMI (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.version != '' && needs.resolve.outputs.configured == 'true'
    # The AWS build role trusts this environment's subject claim rather than a
    # branch, so a run dispatched from a pull request branch can authenticate
    # too. GitHub creates the environment on first use; protection rules (for
    # example required reviewers) can be added to it in the repository settings
    # without touching the trust policy.
    environment: ami-build
    permissions:
      contents: read
      # Required for the OIDC token that the AWS role trusts. This is what
      # replaces a stored access key.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assume the build role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          role-session-name: synaplan-ami-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Marketplace encryption compatibility
        run: |
          set -euo pipefail
          encryption_by_default="$(
            aws ec2 get-ebs-encryption-by-default \
              --query EbsEncryptionByDefault \
              --output text
          )"
          if [ "$encryption_by_default" != False ]; then
            echo "::error::EBS encryption by default is enabled in ${AWS_REGION}. AWS Marketplace cannot ingest the encrypted AMI this build would produce."
            exit 1
          fi

      - name: Install Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: 1.16.0

      - name: Build
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          packer init deploy/aws/packer/synaplan.pkr.hcl
          packer build \
            -var "synaplan_version=${VERSION}" \
            -var "architecture=${ARCHITECTURE}" \
            -var "region=${AWS_REGION}" \
            deploy/aws/packer/synaplan.pkr.hcl

      - name: Report the AMI
        id: ami
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          ami="$(jq -r '.builds[-1].artifact_id' packer-manifest.json | cut -d: -f2)"
          [ -n "$ami" ] && [ "$ami" != null ] || {
            echo "::error::The build produced no AMI id"
            exit 1
          }
          echo "ami=${ami}" >> "$GITHUB_OUTPUT"
          {
            echo "### Synaplan ${VERSION} — ${ARCHITECTURE}"
            echo ""
            echo "AMI: \`${ami}\` in \`${AWS_REGION}\`"
            echo ""
            echo "The submit job below offers this AMI to the listing once the"
            echo "verification launch has passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate and share the AMI with AWS Marketplace
        env:
          AMI_ID: ${{ steps.ami.outputs.ami }}
        run: |
          set -euo pipefail
          read -r -a snapshot_ids <<< "$(
            aws ec2 describe-images \
              --image-ids "$AMI_ID" \
              --query 'Images[0].BlockDeviceMappings[].Ebs.SnapshotId' \
              --output text
          )"
          if [ "${#snapshot_ids[@]}" -eq 0 ]; then
            echo "::error::${AMI_ID} has no EBS snapshots."
            exit 1
          fi

          encrypted_snapshots="$(
            aws ec2 describe-snapshots \
              --snapshot-ids "${snapshot_ids[@]}" \
              --query 'Snapshots[?Encrypted].SnapshotId' \
              --output text
          )"
          if [ -n "$encrypted_snapshots" ]; then
            echo "::error::${AMI_ID} uses encrypted snapshots (${encrypted_snapshots}); AWS Marketplace cannot ingest it."
            exit 1
          fi

          aws ec2 modify-image-attribute \
            --image-id "$AMI_ID" \
            --launch-permission \
            "Add=[{UserId=${AWS_MARKETPLACE_INGESTION_ACCOUNT_ID}}]"

          shared_account="$(
            aws ec2 describe-image-attribute \
              --image-id "$AMI_ID" \
              --attribute launchPermission \
              --query "LaunchPermissions[?UserId=='${AWS_MARKETPLACE_INGESTION_ACCOUNT_ID}'].UserId | [0]" \
              --output text
          )"
          if [ "$shared_account" != "$AWS_MARKETPLACE_INGESTION_ACCOUNT_ID" ]; then
            echo "::error::${AMI_ID} was not shared with the AWS Marketplace ingestion account."
            exit 1
          fi

      - name: Upload the build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packer-manifest-${{ matrix.architecture }}
          path: packer-manifest.json
          retention-days: 30

  verify:
    name: Launch and smoke-test the AMI
    runs-on: ubuntu-latest
    needs: [resolve, build]
    # Only the x86_64 image is launched. The two AMIs come out of the same
    # provisioner on the same base OS, so a second launch would re-test the
    # scripts rather than the architecture, for a second instance-hour.
    # The trigger is spelled out rather than tested as `inputs.verify != false`.
    # On a tag push the inputs context is empty, and GitHub compares an empty
    # string to a boolean by casting both to a number — so `'' != false` is
    # false, and the smoke test silently skipped every single release build. It
    # only ever ran when someone dispatched the workflow by hand.
    if: >-
      needs.resolve.outputs.version != '' &&
      contains(fromJSON(needs.resolve.outputs.matrix), 'x86_64') &&
      (github.event_name != 'workflow_dispatch' || inputs.verify)
    # Same reasoning as on the build job: the AWS role trusts the environment.
    environment: ami-build
    permissions:
      contents: read
      id-token: write

    env:
      STACK_NAME: synaplan-verify-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assume the build role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          role-session-name: synaplan-verify-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          # The default hour is not enough any more: waiting out a cold first
          # boot alone may take fifty minutes. This is the maximum the role
          # permits; the teardown re-assumes below rather than trusting even
          # this to outlast a pathological run.
          role-duration-seconds: 7200

      - name: Download the build manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packer-manifest-x86_64

      - name: Read the AMI id
        id: ami
        run: |
          set -euo pipefail
          ami="$(jq -r '.builds[-1].artifact_id' packer-manifest.json | cut -d: -f2)"
          echo "ami=${ami}" >> "$GITHUB_OUTPUT"

      # The same template a Marketplace buyer launches, with the same defaults
      # except the two that only cost money here: the smallest allowed data
      # volume and no snapshot policy. Testing the AMI without the template
      # would leave the delivery path — instance profile, tags, security group,
      # data volume — untested, and that is where a launch actually breaks.
      - name: Create the stack
        env:
          AMI_ID: ${{ steps.ami.outputs.ami }}
        run: |
          set -euo pipefail
          aws cloudformation create-stack \
            --stack-name "$STACK_NAME" \
            --template-body file://deploy/aws/cloudformation/synaplan-new-vpc.yaml \
            --capabilities CAPABILITY_IAM \
            --on-failure DO_NOTHING \
            --parameters \
              "ParameterKey=ImageId,ParameterValue=${AMI_ID}" \
              ParameterKey=InstanceType,ParameterValue=c7i.xlarge \
              ParameterKey=DataVolumeSize,ParameterValue=20 \
              ParameterKey=AllowedWebCidr,ParameterValue=0.0.0.0/0 \
              ParameterKey=EnableDailySnapshots,ParameterValue=false \
              ParameterKey=AdminEmail,ParameterValue=verify@example.com
          aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME"

      - name: Read the stack outputs
        id: stack
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output json)"
          for key in InstanceId DataVolumeId WebUrl; do
            value="$(jq -r --arg k "$key" '.[] | select(.OutputKey == $k) | .OutputValue' <<<"$outputs")"
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done

      # The instance answers once firstboot.sh has written the configuration and
      # synaplan.service has brought the stack up — the two units run in that
      # order and allow themselves TimeoutStartSec=900 and 1800. A wait shorter
      # than their combined 2700 seconds calls an AMI dead while its first boot
      # is still within the budget the units grant it, which is exactly what the
      # previous 15 minutes did. So: the full budget, plus five minutes for
      # Caddy and the first request.
      #
      # That budget is only for a boot that is still going. A unit that has
      # already failed will never make /api/health answer, and waiting out the
      # rest of the fifty minutes is how three verification runs each cost an
      # hour. After a minute and a half Session Manager is up; from then on,
      # a failed firstboot or stack aborts this wait immediately.
      - name: Wait for the web interface
        env:
          WEB_URL: ${{ steps.stack.outputs.WebUrl }}
          INSTANCE_ID: ${{ steps.stack.outputs.InstanceId }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3000))
          last_unit_check=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            # -k: without a domain the instance serves the self-signed
            # certificate, which is the configuration under test.
            if curl -ksSf --max-time 10 "${WEB_URL}/api/health" >/dev/null; then
              echo "The instance answers on ${WEB_URL}/api/health after $((SECONDS / 60)) minutes."
              exit 0
            fi

            if [ "$SECONDS" -ge 90 ] && [ $((SECONDS - last_unit_check)) -ge 60 ]; then
              last_unit_check=$SECONDS
              ping_status="$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || true)"
              if [ "$ping_status" = Online ]; then
                command_id="$(aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name AWS-RunShellScript \
                  --comment "Synaplan verification unit probe" \
                  --parameters 'commands=["systemctl is-failed synaplan-firstboot.service; systemctl is-failed synaplan.service; systemctl is-failed caddy.service"]' \
                  --query Command.CommandId --output text 2>/dev/null || true)"
                if [ -n "${command_id:-}" ] && [ "$command_id" != None ]; then
                  for _ in $(seq 1 12); do
                    sleep 5
                    probe_status="$(aws ssm get-command-invocation \
                      --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                      --query Status --output text 2>/dev/null || echo Pending)"
                    case "$probe_status" in
                      Success|Failed|Cancelled|TimedOut) break ;;
                    esac
                  done
                  units="$(aws ssm get-command-invocation \
                    --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                    --query StandardOutputContent --output text 2>/dev/null || true)"
                  echo "Unit probe after $((SECONDS / 60)) minutes:"
                  printf '%s\n' "$units"
                  if printf '%s\n' "$units" | grep -qx failed; then
                    echo "::error::A boot unit has already failed; /api/health will not appear. See the unit probe above."
                    exit 1
                  fi
                fi
              fi
            fi

            echo "No answer yet, $((SECONDS / 60)) minutes elapsed."
            sleep 20
          done
          echo "::error::${WEB_URL} never became healthy within 50 minutes."
          exit 1

      # The same smoke test a self-hosted installation runs, executed on the
      # instance over Session Manager — which also proves the shell path the
      # Usage Instructions promise, with no SSH key and no open port 22.
      - name: Run the smoke test on the instance
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.InstanceId }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Synaplan release verification" \
            --parameters 'commands=["/usr/local/bin/synaplan-smoke-test"]' \
            --query Command.CommandId --output text)"

          status=Pending
          for _ in $(seq 1 60); do
            sleep 10
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'join(`"\n"`, [StandardOutputContent, StandardErrorContent])' \
            --output text

          [ "$status" = Success ] || {
            echo "::error::The smoke test on ${INSTANCE_ID} ended as ${status}."
            exit 1
          }

      # A session of its own for everything that follows. The steps above can
      # legitimately run for hours — each CloudFormation waiter allows roughly
      # one, the wait for the web interface another fifty minutes — and no
      # session length can be chosen that certainly outlasts all of them.
      # Expired credentials in the steps below would cost the diagnosis of the
      # failure and, worse, the deletion of an instance that bills by the hour.
      # The OIDC token stays valid for as long as the job does, so this assume
      # succeeds even where the first one has long expired.
      - name: Refresh the credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          role-session-name: synaplan-teardown-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show why the stack failed
        if: failure()
        run: |
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" \
            --query 'reverse(StackEvents[?ResourceStatus!=`CREATE_COMPLETE`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason])' \
            --output table || true

      # Stack events describe the delivery, not the instance, so a boot that
      # never served anything used to leave nothing behind at all: the next step
      # deletes the instance, and the only fact on record was that port 443 stayed
      # quiet. Everything here is best-effort — a diagnosis must not replace the
      # failure it is diagnosing.
      - name: Collect the instance diagnostics
        if: failure()
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.InstanceId }}
        run: |
          set -uo pipefail
          instance_id="${INSTANCE_ID:-}"
          if [ -z "$instance_id" ] || [ "$instance_id" = None ]; then
            # The outputs are only read on the way through, so a creation that
            # failed skips them. --on-failure DO_NOTHING can still leave the
            # instance standing, and then it is the only witness there is.
            instance_id="$(aws cloudformation describe-stack-resource \
              --stack-name "$STACK_NAME" --logical-resource-id Instance \
              --query StackResourceDetail.PhysicalResourceId \
              --output text 2>/dev/null || true)"
          fi
          if [ -z "$instance_id" ] || [ "$instance_id" = None ]; then
            echo "The stack never produced an instance, so there is nothing to collect."
            exit 0
          fi

          # Reaches a boot that failed before Session Manager came up, which is
          # the one case the commands below cannot observe. Allowed to fail:
          # ec2:GetConsoleOutput is missing from an older deployment of
          # marketplace-roles.yaml, and that must not hide the rest.
          echo "::group::Console output"
          aws ec2 get-console-output --instance-id "$instance_id" \
            --query Output --output text || echo "Not available."
          echo "::endgroup::"

          ping_status="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${instance_id}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text 2>/dev/null || true)"
          echo "Session Manager reports the instance as ${ping_status:-unreachable}."
          [ "$ping_status" = Online ] || exit 0

          # synaplan-smoke-test is the project's own status command and resolves
          # the deployment configuration itself, which a bare `compose ps` in a
          # remote shell cannot.
          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "Synaplan verification diagnostics" \
            --parameters 'commands=[
              "systemctl --no-pager --full status synaplan-firstboot synaplan caddy || true",
              "journalctl --no-pager -u synaplan-firstboot -u synaplan -u caddy -n 300 || true",
              "ss -lntp || true",
              "/usr/local/bin/synaplan-smoke-test || true"
            ]' \
            --query Command.CommandId --output text)" || exit 0

          for _ in $(seq 1 30); do
            sleep 10
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance_id" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "::group::The instance's own view"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query 'join(`"\n"`, [StandardOutputContent, StandardErrorContent])' \
            --output text || true
          echo "::endgroup::"

      # Unconditional, including after a cancelled run: what is left behind here
      # is a running instance that bills by the hour. The data volume has
      # DeletionPolicy Snapshot, so the stack leaves a snapshot of its own
      # behind, and a verification run has nothing worth keeping.
      - name: Delete the stack and its leftovers
        if: always()
        run: |
          set -uo pipefail
          # Resolved here rather than taken from the outputs, so a stack that
          # never finished creating is cleaned up just as completely.
          VOLUME_ID="$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" --logical-resource-id DataVolume \
            --query StackResourceDetail.PhysicalResourceId --output text 2>/dev/null || true)"

          aws cloudformation delete-stack --stack-name "$STACK_NAME" || true
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" || true

          [ -n "$VOLUME_ID" ] && [ "$VOLUME_ID" != None ] || exit 0
          snapshots="$(aws ec2 describe-snapshots --owner-ids self \
            --filters "Name=volume-id,Values=${VOLUME_ID}" \
            --query 'Snapshots[].SnapshotId' --output text)"
          for snapshot in $snapshots; do
            echo "Deleting the leftover snapshot ${snapshot}."
            aws ec2 delete-snapshot --snapshot-id "$snapshot" || true
          done

  submit:
    name: Offer the version to the Marketplace listing
    runs-on: ubuntu-latest
    needs: [resolve, build, verify]
    # Verification is not optional here. The build job proves an AMI exists and
    # is ingestible; only the launch proves it boots and serves. Offering an
    # unverified image to customers is the one mistake this listing cannot take
    # back cheaply, so a run that skipped the launch skips the submission too.
    if: >-
      needs.resolve.outputs.version != '' &&
      needs.resolve.outputs.configured == 'true' &&
      needs.verify.result == 'success'
    # Same trust path as the other AWS jobs: the role trusts this environment's
    # subject claim, not a branch.
    environment: ami-build
    permissions:
      contents: read
      id-token: write

    steps:
      # The listing is created by hand in the Management Portal, and until it
      # exists there is no entity to change. Skipped rather than failed, exactly
      # like the missing build role above.
      - name: Check the listing
        id: listing
        env:
          PRODUCT_ID: ${{ secrets.AWS_MARKETPLACE_PRODUCT_ID }}
          INGESTION_ROLE_ARN: ${{ secrets.AWS_MARKETPLACE_INGESTION_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [ -z "${PRODUCT_ID:-}" ] || [ -z "${INGESTION_ROLE_ARN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### AWS Marketplace"
              echo ""
              echo "No \`AWS_MARKETPLACE_PRODUCT_ID\` and \`AWS_MARKETPLACE_INGESTION_ROLE_ARN\`;"
              echo "the version was not offered to a listing. See docs/AWS_MARKETPLACE_LISTING.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.listing.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assume the build role
        if: steps.listing.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          role-session-name: synaplan-submit-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download the build manifests
        if: steps.listing.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packer-manifest-*
          path: manifests

      - name: Offer each architecture as a version
        if: steps.listing.outputs.configured == 'true'
        env:
          PRODUCT_ID: ${{ secrets.AWS_MARKETPLACE_PRODUCT_ID }}
          INGESTION_ROLE_ARN: ${{ secrets.AWS_MARKETPLACE_INGESTION_ROLE_ARN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCHITECTURES: ${{ needs.resolve.outputs.matrix }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          {
            echo "### AWS Marketplace"
            echo ""
            echo "Offering \`${VERSION}\` to the listing, one version per architecture."
            echo "Each is validated before it is submitted, and AWS reviews a submitted version"
            echo "before it becomes available."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # One AMI per version, by AWS's rule that every delivery option of a
          # version shares the same AmiSource. Two architectures are therefore
          # two versions, and they have to go one after another: a running change
          # set locks the entity and the second call would fail with
          # ResourceInUseException.
          for architecture in $(printf '%s' "$ARCHITECTURES" | jq -r '.[]'); do
            manifest="manifests/packer-manifest-${architecture}/packer-manifest.json"
            if [ ! -f "$manifest" ]; then
              echo "::error::No build manifest for ${architecture}; refusing to guess an AMI id."
              exit 1
            fi

            ami="$(jq -r '.builds[-1].artifact_id' "$manifest" | cut -d: -f2)"
            if [ -z "$ami" ] || [ "$ami" = null ]; then
              echo "::error::${manifest} carries no AMI id."
              exit 1
            fi

            case "$architecture" in
              arm64) instance_type=m7g.xlarge ;;
              *)     instance_type=m7i.xlarge ;;
            esac

            # Mirrors deploy/aws/packer/synaplan.pkr.hcl's source_ami_filter and
            # deploy/aws/scripts/harden.sh: Amazon Linux 2023, ec2-user, sshd
            # listening but password and root login refused.
            details="$(jq -n \
              --arg title "${VERSION} (${architecture})" \
              --arg notes "Synaplan ${VERSION}. Release notes: ${RELEASE_URL}" \
              --arg ami "$ami" \
              --arg role "$INGESTION_ROLE_ARN" \
              --arg instance_type "$instance_type" \
              '{
                Version: { VersionTitle: $title, ReleaseNotes: $notes },
                DeliveryOptions: [{
                  Details: {
                    AmiDeliveryOptionDetails: {
                      AmiSource: {
                        AmiId: $ami,
                        AccessRoleArn: $role,
                        UserName: "ec2-user",
                        ScanningPort: 22,
                        OperatingSystemName: "AMAZONLINUX",
                        OperatingSystemVersion: "2023"
                      },
                      UsageInstructions: "Launch the instance, then open https://<public IP or your domain>. Sign in with the administrator address shown in the CloudFormation outputs; the single-use password is stored in SSM Parameter Store under /synaplan/<instance-id>/admin-password and must be replaced at first sign-in. Add an AI provider key under Admin, AI Providers. Full guide: https://github.com/metadist/synaplan/blob/main/deploy/aws/README.md",
                      RecommendedInstanceType: $instance_type,
                      SecurityGroups: [
                        { IpProtocol: "tcp", FromPort: 443, ToPort: 443, IpRanges: ["0.0.0.0/0"] },
                        { IpProtocol: "tcp", FromPort: 80, ToPort: 80, IpRanges: ["0.0.0.0/0"] }
                      ]
                    }
                  }
                }]
              }')"

            change_set="$(jq -n \
              --arg product "$PRODUCT_ID" \
              --argjson details "$details" \
              '[{
                ChangeType: "AddDeliveryOptions",
                Entity: { Identifier: $product, Type: "AmiProduct@1.0" },
                DetailsDocument: $details
              }]')"

            # Validated first, then submitted, both inside this run. VALIDATE
            # asks AWS whether it would accept the document without creating
            # anything, which is how a wrong product id or a role AWS cannot
            # assume is caught before a real version exists. This used to be a
            # separate dry run, requested through a repository variable that a
            # maintainer had to flip after reading a job summary — a step
            # between two releases that nobody remembers.
            echo "::group::${architecture}: validate ${ami}"
            aws marketplace-catalog start-change-set \
              --catalog AWSMarketplace \
              --intent VALIDATE \
              --client-request-token "synaplan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${architecture}-validate" \
              --change-set "$change_set" > /dev/null
            echo "Accepted."
            echo "::endgroup::"

            echo "::group::${architecture}: submit ${ami}"
            id="$(
              aws marketplace-catalog start-change-set \
                --catalog AWSMarketplace \
                --intent APPLY \
                --client-request-token "synaplan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${architecture}" \
                --change-set "$change_set" \
                --query ChangeSetId --output text
            )"
            echo "Change set ${id}."
            echo "::endgroup::"

            # Waited out rather than fired and forgotten, for two reasons: the
            # next architecture cannot start while this change set holds the
            # entity, and a rejected document has to fail this job rather than
            # sit unnoticed in the portal.
            for _ in $(seq 1 60); do
              status="$(
                aws marketplace-catalog describe-change-set \
                  --catalog AWSMarketplace --change-set-id "$id" \
                  --query Status --output text
              )"
              case "$status" in
                SUCCEEDED)
                  echo "- \`${architecture}\`: \`${ami}\` submitted (change set \`${id}\`)" >> "$GITHUB_STEP_SUMMARY"
                  break
                  ;;
                FAILED|CANCELLED)
                  reason="$(
                    aws marketplace-catalog describe-change-set \
                      --catalog AWSMarketplace --change-set-id "$id" \
                      --query 'ChangeSet[].ErrorDetailList' --output json
                  )"
                  echo "::error::Change set ${id} for ${architecture} ended as ${status}: ${reason}"
                  exit 1
                  ;;
                *)
                  sleep 30
                  ;;
              esac
            done

            if [ "$status" != SUCCEEDED ]; then
              echo "::error::Change set ${id} for ${architecture} was still ${status} after thirty minutes."
              exit 1
            fi
          done
