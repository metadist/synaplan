name: Marketplace Versions

# Offers each release to the AWS Marketplace AMI listing, and reports how AWS
# received it. The only place that submits a version — aws-ami.yml builds and
# smoke-tests the x86_64 image and marks it, nothing more.
#
# x86_64 only: an AWS Marketplace AMI product is tied to the CPU architecture of
# the versions it has already published, so arm64 cannot become a second version
# of this listing — see scripts/marketplace-change-set.mjs for what that cost to
# find out. One version per run regardless, because AWS answers a second
# `AddDeliveryOptions` on the same product with an error while the first is
# still in flight, and ingesting an AMI takes hours — it copies the image into
# every region of the listing and scans it for vulnerabilities.
#
# It runs from the default branch only, and keeps no state of its own: the release
# comes from the version the deployment catalog pins there, the image from its
# tag, and what has already been sent from the listing and the change set
# history. A missed run therefore costs an hour, never a version.

on:
  schedule:
    # Off the hour, so it does not queue behind everything else that runs at :00.
    - cron: '17 * * * *'
  # For not waiting out the hour — after a release, or after a rejection was
  # fixed. Refused from anywhere but the default branch; see the first step.
  workflow_dispatch:

permissions:
  contents: read

# Two runs would race for the same entity and the loser would get an error from
# AWS rather than a clean skip.
concurrency:
  group: marketplace-versions
  cancel-in-progress: false

env:
  # The Marketplace ingests from us-east-1 only.
  AWS_REGION: us-east-1

jobs:
  offer:
    name: Offer the remaining versions to the listing
    runs-on: ubuntu-latest
    # Same trust path as the jobs in aws-ami.yml: the AWS role trusts this
    # environment's subject claim, not a branch.
    environment: ami-build
    permissions:
      contents: read
      id-token: write

    steps:
      # Checked before anything else, because this job holds real AWS
      # credentials and creates real versions of a public listing: the
      # ami-build environment carries no deployment branch policy, so nothing
      # else keeps a dispatch from a feature branch out. From there it would
      # read that branch's pin and its copy of the scripts, and could offer a
      # version nobody released.
      #
      # Only dispatches are examined. A scheduled run is on the default branch
      # by definition, and asking the event payload about it would make the
      # hourly run depend on a field that a schedule payload need not carry.
      - name: Require the default branch
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$SELECTED" != "$DEFAULT" ]; then
            echo "::error::A version is offered from ${DEFAULT}, not from ${SELECTED}."
            exit 1
          fi

      # Skipped rather than failed while the listing does not exist yet, exactly
      # like the submit job in aws-ami.yml. An hourly schedule must not turn a
      # not-yet-configured listing into an hourly red run.
      - name: Check the listing credentials
        id: config
        env:
          PRODUCT_ID: ${{ secrets.AWS_MARKETPLACE_PRODUCT_ID }}
          INGESTION_ROLE_ARN: ${{ secrets.AWS_MARKETPLACE_INGESTION_ROLE_ARN }}
          BUILD_ROLE_ARN: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
        run: |
          if [ -n "${PRODUCT_ID:-}" ] && [ -n "${INGESTION_ROLE_ARN:-}" ] && [ -n "${BUILD_ROLE_ARN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No AWS Marketplace listing is configured; nothing to offer." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Assume the build role
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          role-session-name: synaplan-marketplace-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # The version a new deployment installs is the version the listing should
      # offer. Reading it from the catalog rather than from the newest tag is
      # deliberate: a tag whose rollout was held back by a guard is not a release
      # anybody should be able to buy.
      - name: Read the release the catalog pins
        id: release
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          version="$(node scripts/read-release-version.mjs | jq -r .version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Report change sets that finished
        id: finished
        if: steps.config.outputs.configured == 'true'
        env:
          PRODUCT_ID: ${{ secrets.AWS_MARKETPLACE_PRODUCT_ID }}
        run: |
          set -euo pipefail

          summaries="$(
            aws marketplace-catalog list-change-sets \
              --catalog AWSMarketplace \
              --filter-list "$(jq -nc --arg id "$PRODUCT_ID" '[{Name:"EntityId",ValueList:[$id]}]')" \
              --query 'ChangeSetSummaryList[].{Id:ChangeSetId,Status:Status,Start:StartTime,End:EndTime}' \
              --output json
          )"

          # ISO-8601 in UTC sorts lexicographically, so a string comparison is a
          # date comparison here. The window matches the schedule: anything that
          # ended since the previous run is new, and a little overlap only ever
          # repeats a message, never drops one.
          since="$(date -u -d '65 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"

          inflight="$(printf '%s' "$summaries" | jq -r '[.[] | select(.Status == "PREPARING" or .Status == "APPLYING")] | length')"
          echo "inflight=${inflight}" >> "$GITHUB_OUTPUT"

          failed="$(
            printf '%s' "$summaries" |
              jq -r --arg since "$since" '
                [.[] | select(.Status == "FAILED" or .Status == "CANCELLED") | select((.End // "") > $since) | .Id]
                | join(" ")
              '
          )"

          for id in $failed; do
            reason="$(
              aws marketplace-catalog describe-change-set \
                --catalog AWSMarketplace --change-set-id "$id" \
                --query 'ChangeSet[].ErrorDetailList' --output json
            )"
            echo "::error::AWS rejected change set ${id}: ${reason}"
            echo "AWS rejected change set \`${id}\`: ${reason}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

          if [ "$inflight" -gt 0 ]; then
            echo "A change set is still in flight; AWS accepts no further version until it ends." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Nothing else can be submitted while AWS is working on one, so the rest of
      # the job is skipped rather than attempted and rejected.
      - name: Find the versions the listing is missing
        id: missing
        if: steps.config.outputs.configured == 'true' && steps.finished.outputs.inflight == '0'
        env:
          PRODUCT_ID: ${{ secrets.AWS_MARKETPLACE_PRODUCT_ID }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # Every VersionTitle anywhere in the document, rather than one fixed
          # path: the entity shape is AWS's to change, and reading it loosely
          # fails safe.
          offered="$(
            aws marketplace-catalog describe-entity \
              --catalog AWSMarketplace --entity-id "$PRODUCT_ID" \
              --query DetailsDocument --output json |
              jq -c '[.. | objects | .VersionTitle? // empty]'
          )"

          # What the listing shows is not everything it has been sent. A
          # submission that is still being ingested is not part of the entity
          # yet, and one that failed never will be — and both have to count,
          # the first so it is not sent twice, the second so a rejected image is
          # not sent again every hour. Only the change set history knows about
          # them.
          ids="$(
            aws marketplace-catalog list-change-sets \
              --catalog AWSMarketplace \
              --filter-list "$(jq -nc --arg id "$PRODUCT_ID" '[{Name:"EntityId",ValueList:[$id]}]')" \
              --query 'ChangeSetSummaryList[].ChangeSetId' --output json |
              jq -r '.[]'
          )"

          attempted='[]'
          for id in $ids; do
            # Every title anywhere in the document, for the same reason as
            # above, and because DetailsDocument is an object for some change
            # types and an array for others — a fixed path breaks on the ones it
            # was not written for.
            #
            # VALIDATE change sets are on record too, from before this stopped
            # sending them, and they created nothing that could collide.
            titles="$(
              aws marketplace-catalog describe-change-set \
                --catalog AWSMarketplace --change-set-id "$id" --output json |
                jq -c 'if .Intent == "APPLY" then [.. | objects | .VersionTitle? // empty] else [] end'
            )"
            attempted="$(printf '%s' "$attempted" | jq -c --argjson t "$titles" '. + $t')"
          done

          known="$(jq -nc --argjson a "$offered" --argjson b "$attempted" '$a + $b')"
          missing="$(node scripts/marketplace-change-set.mjs missing --version "$VERSION" --known "$known")"

          echo "architectures=${missing}" >> "$GITHUB_OUTPUT"
          if [ -z "$missing" ]; then
            echo "The listing already offers \`${VERSION}\` for every architecture." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Offer the next one
        id: offer
        if: steps.missing.outputs.architectures != ''
        env:
          PRODUCT_ID: ${{ secrets.AWS_MARKETPLACE_PRODUCT_ID }}
          INGESTION_ROLE_ARN: ${{ secrets.AWS_MARKETPLACE_INGESTION_ROLE_ARN }}
          VERSION: ${{ steps.release.outputs.version }}
          MISSING: ${{ steps.missing.outputs.architectures }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # What the listing lets a customer launch. The recommended type of a
          # version has to be one of these, and inventing one instead cost a
          # rejected submission: the listing offered three Intel types, arm64 was
          # offered with a Graviton recommendation, and AWS answered
          # RECOMMENDED_INSTANCE_TYPE_NOT_AVAILABLE.
          available="$(
            aws marketplace-catalog describe-entity \
              --catalog AWSMarketplace --entity-id "$PRODUCT_ID" \
              --query 'DetailsDocument.Compatibility.AvailableInstanceTypes' --output json
          )"

          # An empty or absent list is a different thing from a missing image or
          # an architecture the listing does not carry, and it is not skipped
          # quietly: nothing at all could ever be offered, and no amount of
          # waiting fixes it. Left unchecked it surfaced as `Cannot iterate over
          # null` from jq, or as an argument error from the EC2 call below, in an
          # hourly job nobody reads until a release is found missing.
          if [ "$(printf '%s' "$available" | jq 'if type == "array" then length else 0 end')" -eq 0 ]; then
            echo "::error::The listing offers no instance types under Compatibility, so no version can be offered. Add the types synaplan-new-vpc.yaml accepts."
            exit 1
          fi

          # Which of them runs which architecture, asked of EC2 rather than read
          # off the family letter. A `g` in the name is a convention, not a
          # contract, and the answer decides what a customer is told to launch.
          names="$(printf '%s' "$available" | jq -r '.[]' | tr '\n' ' ')"

          # Deliberate word splitting: --instance-types takes a list.
          # shellcheck disable=SC2086
          architectures="$(
            aws ec2 describe-instance-types \
              --instance-types $names \
              --query 'InstanceTypes[].{type:InstanceType,architectures:ProcessorInfo.SupportedArchitectures}' \
              --output json
          )"

          submitted=''
          for architecture in $MISSING; do
            # In the listing's own order, so the first type it names for an
            # architecture is the one recommended.
            instance_type="$(
              printf '%s' "$architectures" |
                jq -r --arg a "$architecture" --argjson order "$available" '
                  (map({(.type): .architectures}) | add) as $by
                  | [$order[] | select((($by[.]) // []) | index($a))][0] // ""
                '
            )"
            if [ -z "$instance_type" ]; then
              echo "The listing offers no \`${architecture}\` instance type, so \`${VERSION}\` cannot be offered for it. Add one under Compatibility to change that." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # SmokeTested is what aws-ami.yml puts on an image that booted and
            # served, and it is required here rather than merely preferred: it is
            # the only thing left between an image and a public listing now that
            # no job dependency spans the two runs. An image built from a branch
            # never carries it.
            ami="$(
              aws ec2 describe-images --owners self \
                --filters "Name=tag:SynaplanVersion,Values=${VERSION}" \
                          "Name=tag:Architecture,Values=${architecture}" \
                          "Name=tag:SmokeTested,Values=${VERSION}" \
                          "Name=state,Values=available" \
                --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text
            )"
            if [ -z "$ami" ] || [ "$ami" = None ]; then
              # Not an error: the release build may still be running, or its
              # smoke test may have failed and reported that itself.
              echo "No smoke-tested \`${architecture}\` image for \`${VERSION}\` yet." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            change_set="$(
              node scripts/marketplace-change-set.mjs change-set \
                --product "$PRODUCT_ID" \
                --version "$VERSION" \
                --architecture "$architecture" \
                --ami "$ami" \
                --role "$INGESTION_ROLE_ARN" \
                --instance-type "$instance_type" \
                --release-url "$RELEASE_URL"
            )"

            # Sent once, with APPLY. An `Intent=VALIDATE` call used to go first,
            # on the assumption that it checks the document before anything real
            # is created — but it returns an id immediately and does its checking
            # asynchronously, over the same half hour, so its verdict arrived
            # long after the submission it was meant to guard. All it produced
            # was a second change set with the same title in the portal. What it
            # was supposed to catch, a duplicate, cannot happen now that the
            # history above is consulted; what it cannot catch either way, a
            # rejected image, ends as a FAILED change set and is reported.
            id="$(
              aws marketplace-catalog start-change-set \
                --catalog AWSMarketplace \
                --intent APPLY \
                --client-request-token "synaplan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${architecture}" \
                --change-set "$change_set" \
                --query ChangeSetId --output text
            )"

            # One per run: AWS answers a second AddDeliveryOptions on the same
            # product with an error while this one is in flight.
            submitted="$(printf '%s' "$change_set" | jq -r '.[0].DetailsDocument.Version.VersionTitle')"
            {
              echo "Submitted \`${submitted}\` as change set \`${id}\`, using \`${ami}\` on \`${instance_type}\`."
              echo ""
              echo "AWS scans and copies the image for a few hours; a later run of this workflow reports how it ended."
            } >> "$GITHUB_STEP_SUMMARY"
            break
          done

          echo "submitted=${submitted}" >> "$GITHUB_OUTPUT"
          if [ -z "$submitted" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing was offered this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only ever speaks when something happened. An hourly job that reports
      # "nothing to do" teaches everyone to ignore the channel it reports to.
      - name: Report to Discord
        if: always() && (steps.offer.outputs.submitted != '' || steps.finished.outputs.failed != '')
        env:
          HOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          SUBMITTED: ${{ steps.offer.outputs.submitted }}
          FAILED: ${{ steps.finished.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "${HOOK:-}" || exit 0

          if [ -n "${FAILED:-}" ]; then
            content="AWS Marketplace rejected a version. Change sets: ${FAILED}. ${RUN_URL}"
          else
            content="AWS Marketplace received \`${SUBMITTED}\`. Review takes a few days. ${RUN_URL}"
          fi

          curl --silent --show-error --fail-with-body \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg content "$content" '{content: $content}')" \
            "$HOOK" > /dev/null
