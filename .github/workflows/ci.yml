name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Superseded runs on the same PR just burn runner capacity, which is shared
# across the organization (the plan allows 60 concurrent standard-runner jobs
# and one run peaks at ~7). Push/tag runs get a unique group (run_id) so main
# runs neither serialize nor cancel each other — the publish jobs and
# cloudflare-deploy must never be interrupted or skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: PHP Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          # `redis` (phpredis) is in composer.json's require for `symfony/redis-messenger`,
          # so installing without it would force `--ignore-platform-req=ext-redis` here too.
          extensions: mbstring, xml, ctype, iconv, intl, redis
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Run code formatting check
        working-directory: backend
        run: composer lint

      # Host-side deployment helpers (deploy/scripts/lib.sh), including the
      # first-admin preflight. The suite stubs `compose()`/`resolved_app_image()`,
      # so it needs nothing but bash and a checkout — this is the leanest job in
      # the gate that already provides both.
      - name: Run deploy-lifecycle bash tests
        run: bash deploy/scripts/tests/test-lifecycle.sh

      # firstboot.sh executed for real, with the metadata service, the AWS CLI
      # and the data volume stubbed. It is the one script no customer can
      # recover from by hand, and the only place it otherwise runs is a
      # published AMI.
      - name: Run the AWS first-boot tests
        run: bash deploy/aws/scripts/tests/test-firstboot.sh

  deployment-templates:
    name: Deployment Templates (AWS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cfn-lint
        run: |
          set -euo pipefail
          pipx install cfn-lint
          # pipx links into ~/.local/bin, which the runner does not necessarily
          # export to later steps.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The templates are what a Marketplace buyer launches, and a broken one is
      # a rejected submission or a failed customer stack. cfn-lint validates them
      # statically against the resource schemas, without an AWS account.
      - name: Validate the CloudFormation templates
        run: cfn-lint deploy/aws/cloudformation/*.yaml

      - name: Install Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: 1.16.0

      - name: Check the Packer template
        run: |
          set -euo pipefail
          packer fmt -check -diff deploy/aws/packer/
          packer init deploy/aws/packer/synaplan.pkr.hcl
          # No credentials and no build: this resolves variables and validates
          # the schema. -evaluate-datasources is off because the source AMI
          # lookup would need an AWS account.
          packer validate deploy/aws/packer/synaplan.pkr.hcl

  mobile-tooling:
    name: Mobile Release Tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      # The impact classifier decides whether a change may reach an installed app
      # over the air, so its own tests are a release gate, not a nicety.
      - name: Run release tooling tests
        run: node --test "tests/*.test.mjs"

  backend:
    name: Backend (PHP/Symfony)
    # Off the critical path (done around minute 2-3 while e2e runs until
    # ~minute 7) and PHPUnit is single-process anyway, so more cores would not
    # shorten the run. Revisit if this job ever becomes the longest one.
    runs-on: ubuntu-latest

    env:
      DATABASE_WRITE_URL: mysql://synaplan_test:synaplan_test@127.0.0.1:3306/synaplan?serverVersion=mariadb-12.2.2&charset=utf8mb4
      DATABASE_READ_URL: mysql://synaplan_test:synaplan_test@127.0.0.1:3306/synaplan?serverVersion=mariadb-12.2.2&charset=utf8mb4

    services:
      mysql:
        image: mariadb:12.3@sha256:a02fe89cb597d4375812b2eac90cf9d0775d4686daa7f7cc750ebbcad7525bbc
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: synaplan_test
          MYSQL_USER: synaplan_test
          MYSQL_PASSWORD: synaplan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # Redis backs cache.app, the lock + rate-limiter components and the
      # Messenger Redis Streams transport. PHPUnit needs a live instance for the
      # RedisIntegrationTest smoke suite that verifies connectivity, CRUD, and
      # version reporting against real Redis. `.env.test` points REDIS_DSN at
      # 127.0.0.1:6379. Digest pinned to match docker-compose.yml for parity
      # (Redis 7.4 — see docker-compose.yml for the Centrifugo pub/sub rationale).
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          # `redis` (phpredis) is required by `symfony/redis-messenger`. Sessions
          # and cache.app use Predis (pure PHP) so they don't need it, but `composer
          # install` would refuse to run without it on the platform-req check.
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, zip, gd, curl, bcmath, exif, pcntl, opcache, readline, soap, sodium, ffi, imagick, grpc, redis
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install protoc from base image
        run: |
          BASE_IMAGE=$(grep -oP 'FROM \K\S+' _docker/backend/Dockerfile | head -1)
          id=$(docker create "$BASE_IMAGE")
          trap "docker rm $id" EXIT
          sudo docker cp $id:/usr/local/bin/protoc /usr/local/bin/protoc
          protoc --version

      - name: Create .env file
        working-directory: backend
        run: cp .env.test .env
        # Job env (e.g. DATABASE_WRITE_URL from services) overrides when PHP runs

      - name: Create plugins symlink
        run: sudo ln -s ${{ github.workspace }}/plugins /plugins

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Security audit
        working-directory: backend
        # Blocking gate: fail the PR on high/critical advisories in production
        # (require) dependencies. Dev-only tools (--no-dev) and lower severities
        # are excluded to avoid blocking on issues that never ship to prod or
        # have no fix yet. Abandoned packages are reported, not failed.
        run: >-
          composer audit --no-dev --abandoned=report
          --ignore-severity=low --ignore-severity=medium --ignore-severity=moderate

      - name: Run PHPStan
        working-directory: backend
        run: composer phpstan

      - name: Setup database schema
        working-directory: backend
        # Migrations are the single source of truth. We deliberately do NOT run
        # `doctrine:schema:update --force` here — if an entity change is missing
        # a migration, CI MUST fail so we surface the gap before deploy.
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Verify schema matches entities (no migration drift)
        working-directory: backend
        # Full schema validation: catches broken ORM mapping AND any entity↔DB
        # drift. Fails any PR that changes an entity without shipping a matching
        # Doctrine migration. Unblocked by:
        #   - doctrine/dbal 4.x upgrade (#781)
        #   - `server_version: mariadb-*` in doctrine.yaml (correct platform routing)
        #   - Version20260423000000 + Version20260429000000 (schema reconciliation)
        # See docs/MIGRATIONS.md for details.
        run: php bin/console doctrine:schema:validate

      - name: Load demo fixtures
        working-directory: backend
        # Loads only dev/test demo data (admin/demo/test users). Production-essential
        # catalog data (models, prompts, defaults, rate limits) is handled by app:seed below.
        run: php bin/console doctrine:fixtures:load --no-interaction

      - name: Seed catalogs (models, prompts, defaults, rate limits)
        working-directory: backend
        # Idempotent seeders that populate BCONFIG with rate limits, default model bindings,
        # AI model catalog and system prompts. Required for integration tests that exercise
        # StorageQuotaService, MessageController, SummaryController, etc.
        run: php bin/console app:seed --no-interaction

      - name: Run PHPUnit tests
        working-directory: backend
        run: php bin/phpunit

      - name: Run migrations-bootstrap bash tests
        run: bash _docker/backend/tests/test-migrations-bootstrap.sh

      - name: Run container-runtime bash tests
        run: bash _docker/backend/tests/test-container-runtime.sh

      # The lint job runs the same suite Docker-free, which SKIPS its tier-1
      # (host shell) vs tier-2 (PHP filter_var) email contract case — the very
      # drift that once shipped and crash-looped managed deployments. This job
      # already pulls the backend base image for protoc, so re-running the suite
      # against the exact PHP that production ships costs a container start.
      - name: Run deploy-lifecycle bash tests (email contract)
        run: |
          set -euo pipefail
          BASE_IMAGE="$(grep -oP 'FROM \K\S+' _docker/backend/Dockerfile | head -1 || true)"
          [ -n "$BASE_IMAGE" ] || {
            echo "::error::Could not resolve the backend base image from _docker/backend/Dockerfile"
            exit 1
          }
          SYNAPLAN_CONTRACT_PHP_IMAGE="$BASE_IMAGE" \
            bash deploy/scripts/tests/test-lifecycle.sh | tee /tmp/lifecycle-contract.log
          # The suite skips the contract case and still exits 0 when the image
          # variable is empty, so a green step alone would not prove the contract
          # ran. Assert the verification line instead of trusting the exit code.
          grep -q 'Bootstrap email contract verified against' /tmp/lifecycle-contract.log || {
            echo "::error::The bootstrap email contract case did not run; it must never be skipped in this job"
            exit 1
          }

  frontend-build:
    name: Frontend Build
    # Head of the critical path (frontend-build → docker-build → e2e), so it
    # starts at t=0 with no `needs`: it dumps the OpenAPI spec itself (PHP
    # setup costs ~35s from caches) instead of waiting for a separate job —
    # a mid-run job hop costs runner-provisioning latency. The spec is
    # uploaded as the `openapi-spec` artifact for frontend-checks and
    # mobile-release-artifacts.yml. nelmio:apidoc:dump compiles the container
    # but never touches the DB (Doctrine connects lazily), so no MariaDB
    # service is needed here.
    #
    # Free runner, and it must stay one. This was the last job on the paid
    # 16-core pool until the move was measured against it, job for job:
    #
    #   - `Build app and widget (parallel)`: 62s on 16 cores vs 69s on 4.
    #     Rollup is largely single-thread-bound, so the extra cores buy ~7s.
    #   - Runner provisioning: 18s on the paid pool vs 3s on the free one,
    #     which more than cancels those 7s out.
    #   - The paid pool has a limited number of slots and queues under load:
    #     during a six-run PR burst three runs waited 30-59s for a -m runner
    #     while every free-runner job in the same runs started in 2-5s.
    #
    # So the paid pool was slower in the only dimension that matters here
    # (time to a green PR) and cost roughly $112/month at ~734 runs. Do not
    # move this back to `ubuntu-latest-m` without re-measuring those three
    # numbers first.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          # Same extension set as the backend job so `composer install` passes
          # the platform-req check (see backend job for the rationale).
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, zip, gd, curl, bcmath, exif, pcntl, opcache, readline, soap, sodium, ffi, imagick, grpc, redis
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install protoc from base image
        run: |
          BASE_IMAGE=$(grep -oP 'FROM \K\S+' _docker/backend/Dockerfile | head -1)
          id=$(docker create "$BASE_IMAGE")
          trap "docker rm $id" EXIT
          sudo docker cp $id:/usr/local/bin/protoc /usr/local/bin/protoc
          protoc --version

      - name: Create .env file
        working-directory: backend
        run: cp .env.test .env

      - name: Create plugins symlink
        run: sudo ln -s ${{ github.workspace }}/plugins /plugins

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate OpenAPI spec
        working-directory: backend
        run: php bin/console nelmio:apidoc:dump --format=json > openapi-spec.json

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-spec
          path: backend/openapi-spec.json
          retention-days: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Copy OpenAPI spec for schema generation
        # src/generated/ is gitignored and absent in a fresh checkout
        run: |
          mkdir -p frontend/src/generated
          cp backend/openapi-spec.json frontend/src/generated/openapi-spec.json

      - name: Generate Zod schemas from OpenAPI spec
        working-directory: frontend
        run: |
          # Use OpenAPI spec from generated folder
          npx openapi-zod-client src/generated/openapi-spec.json -o src/generated/api-schemas.ts --template schema-template.hbs
          # Run post-processing to create readable aliases
          node scripts/generate-schemas.js --skip-fetch
          # Clean up the OpenAPI spec file (we only need the generated schemas)
          rm src/generated/openapi-spec.json

      - name: Build app and widget (parallel)
        working-directory: frontend
        # `npm run build` would also run check:types — that already gates the
        # merge via frontend-checks, so call vite directly here to keep the
        # critical path lean. Separate outDirs (dist/ vs dist-widget/), so the
        # two builds can run concurrently.
        run: |
          npx vite build & APP_PID=$!
          npx vite build --config vite.config.widget.ts & WIDGET_PID=$!
          wait "$APP_PID"
          wait "$WIDGET_PID"

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

      - name: Upload widget build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: widget-dist
          path: frontend/dist-widget/
          retention-days: 1

  frontend-checks:
    name: Frontend (Vue/TypeScript)
    # Format check, lint, vue-tsc and Vitest — everything that gates merging
    # but that docker-build/e2e don't need to wait for. Consumes the
    # openapi-spec artifact from frontend-build; runs off the critical path
    # (plenty of slack before the e2e jobs finish) and vue-tsc is
    # single-threaded anyway, so more cores would not shorten the run.
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Security audit
        working-directory: frontend
        # Blocking gate: fail on high/critical advisories in production
        # dependencies only (--omit=dev). Dev tooling and lower severities do
        # not ship to users and would otherwise block PRs without fixes.
        run: npm audit --omit=dev --audit-level=high

      - name: Download OpenAPI spec artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openapi-spec
          path: frontend/src/generated/

      - name: Generate Zod schemas from OpenAPI spec
        working-directory: frontend
        run: |
          # Use OpenAPI spec from generated folder
          npx openapi-zod-client src/generated/openapi-spec.json -o src/generated/api-schemas.ts --template schema-template.hbs
          # Run post-processing to create readable aliases
          node scripts/generate-schemas.js --skip-fetch
          # Clean up the OpenAPI spec file (we only need the generated schemas)
          rm src/generated/openapi-spec.json

      - name: Check code formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint code
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run check:types

      - name: Run tests
        working-directory: frontend
        run: npm run test

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [frontend-build]
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-labels: ${{ steps.meta.outputs.labels }}
      # The version baked into the image this job builds and every downstream
      # job publishes. Resolved once, here, so the amd64 image, the arm64
      # image and the version advertised to deployments can never disagree —
      # independent resolutions would drift the moment a tag lands between
      # them.
      app-version: ${{ steps.app-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Download widget build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: widget-dist
          path: frontend/dist-widget/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For main branch, tag as 'latest'
            type=raw,value=latest,enable={{is_default_branch}}
            # For tags, extract semantic version (removes 'v' prefix automatically)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # For PRs, tag with PR number
            type=ref,event=pr

      # metadata-action's version follows the first image tag. On main that is
      # `latest`, which must never become APP_VERSION — the sidebar would show
      # that word to every user. Resolve a SemVer (or `dev`) instead.
      - name: Resolve application version
        id: app-version
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force 2>/dev/null || true
          version="$(node scripts/resolve-app-version.mjs --meta "$META_VERSION" --ref "$GITHUB_REF_NAME")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Application version for this image: ${version} (metadata was ${META_VERSION:-empty})"

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: _docker/backend/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
          # Scoped per architecture: the arm64 build in docker-push-arm64 has
          # entirely different layers, and sharing one scope means the two
          # builds evict each other from the 10 GB Actions cache.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          # Export to tar file for sharing between jobs
          outputs: type=docker,dest=/tmp/docker-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  e2e:
    name: E2E Tests (${{ matrix.browser }}${{ matrix.variant && format(' {0}', matrix.variant) || '' }}${{ matrix.auth_method == 'oidc' && ' OIDC' || matrix.auth_method == 'oidc-redirect' && ' OIDC Redirect' || '' }}${{ matrix.shard && format(' [{0}]', matrix.shard) || '' }})
    # E2E jobs run on free ubuntu-latest runners, which are unlimited for
    # public repositories: an extra shard costs nothing, so sharding trades
    # runner count for wall-clock time at no price. Chromium runs the full
    # @ci suite sharded (--shard=N/M) so each half finishes in ~50% of the
    # time, and the free pool starts every shard immediately instead of
    # queueing it. Firefox is a single unsharded @crossbrowser smoke.
    runs-on: ubuntu-latest
    needs: [docker-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard password auth — chromium sharded into 2 parallel jobs
          - browser: chromium
            variant: ""
            auth_method: password
            compose_profiles: ""
            npm_script: "test:e2e"
            grep_filter: "@ci"
            shard: "1/2"
          - browser: chromium
            variant: ""
            auth_method: password
            compose_profiles: ""
            npm_script: "test:e2e"
            grep_filter: "@ci"
            shard: "2/2"
          # Firefox cross-browser SMOKE — a single unsharded job. The firefox
          # project only runs @crossbrowser-tagged tests (engine-divergent flows:
          # SSE, widget Shadow DOM, upload), so the lean set needs no sharding.
          # See frontend/tests/e2e/playwright.config.ts and docs/E2E_TESTING.md §0.
          - browser: firefox
            variant: ""
            auth_method: password
            compose_profiles: ""
            npm_script: "test:e2e:firefox"
            grep_filter: "@ci"
            shard: ""
          # Mobile viewport layout guard (chromium device emulation; runs the
          # @layout suite only — see frontend/tests/e2e/playwright.config.ts)
          - browser: chromium
            variant: "Mobile"
            auth_method: password
            compose_profiles: ""
            npm_script: "test:e2e:mobile"
            grep_filter: "@ci"
            shard: ""
          # OIDC auth (chromium only — auth flow testing, not browser compat)
          - browser: chromium
            variant: ""
            auth_method: oidc
            compose_profiles: "--profile oidc"
            npm_script: "test:e2e:oidc"
            grep_filter: "@oidc"
            shard: ""
          # OIDC auto-redirect (starts app with OIDC_AUTO_REDIRECT=true)
          - browser: chromium
            variant: ""
            auth_method: oidc-redirect
            compose_profiles: "--profile oidc"
            npm_script: "test:e2e:oidc-redirect"
            grep_filter: ""
            shard: ""
    env:
      APP_IMAGE: synaplan-test:ci
      APP_URL: http://localhost:8001
      # Job-level (not step-level) so the backgrounded `up -d` and the later
      # `up --wait` see the same value — a mismatch would recreate containers.
      OIDC_AUTO_REDIRECT: ${{ matrix.auth_method == 'oidc-redirect' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-image
          path: /tmp

      - name: Add host.docker.internal to /etc/hosts
        if: contains(matrix.auth_method, 'oidc')
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Start test stack in background
        # docker load + compose pull + up take ~1.5 min and don't depend on
        # Node/Playwright, so they run in the background while the following
        # steps set up the test runner. "Wait for test services" joins on this.
        run: |
          COMPOSE="docker compose -f docker-compose.test.yml -f docker-compose.test.ci.yml"
          PROFILE="${{ matrix.compose_profiles }}"
          (
            set -e
            docker load -i /tmp/docker-image.tar
            echo "Loaded images:"
            docker images

            # Tag the first loaded image as synaplan-test:ci for docker-compose
            IMAGE_TAG=$(docker images --format "{{.Repository}}:{{.Tag}}" | head -n 1)
            echo "Tagging $IMAGE_TAG as synaplan-test:ci"
            docker tag $IMAGE_TAG synaplan-test:ci

            n=0; until $COMPOSE $PROFILE pull; do n=$((n+1)); [ "$n" -ge 4 ] && exit 1; sleep $((n*15)); done

            # app_test entrypoint loads fixtures on first run (APP_ENV=test, empty DB)
            # so TestProvider model (-1 > -7) and admin user exist for E2E.
            echo "Starting services..."
            $COMPOSE $PROFILE up -d
            touch /tmp/stack-started.ok
          ) > /tmp/stack-startup.log 2>&1 &
          echo $! > /tmp/stack-startup.pid

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-${{ matrix.browser }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          npx playwright install-deps ${{ matrix.browser }}

      - name: Wait for test services
        run: |
          COMPOSE="docker compose -f docker-compose.test.yml -f docker-compose.test.ci.yml"
          PROFILE="${{ matrix.compose_profiles }}"

          echo "Waiting for background stack startup to finish..."
          PID=$(cat /tmp/stack-startup.pid)
          while kill -0 "$PID" 2>/dev/null; do sleep 2; done
          echo "=== Stack startup log ==="
          cat /tmp/stack-startup.log
          if [ ! -f /tmp/stack-started.ok ]; then
            echo "Stack startup failed (see log above)."
            exit 1
          fi

          # Start following logs in background
          $COMPOSE $PROFILE logs -f &

          echo "Waiting for services to be healthy..."
          $COMPOSE $PROFILE up --wait || {
            echo "Failed to start services. Status:"
            $COMPOSE $PROFILE ps
            echo ""
            echo "Container logs:"
            $COMPOSE $PROFILE logs
            exit 1
          }

          # Wait for Keycloak provisioning to complete (if OIDC)
          if [[ "${{ matrix.auth_method }}" == oidc* ]]; then
            echo "Waiting for Keycloak provisioning..."
            # Use -a to include exited containers (setup is a one-shot sidecar)
            SETUP_ID=$($COMPOSE $PROFILE ps -a -q keycloak_setup)
            if [ -n "$SETUP_ID" ]; then
              docker wait "$SETUP_ID" || true
            fi
          fi

          echo "Services are ready!"
          $COMPOSE $PROFILE ps

      - name: Run E2E tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8001
          KEYCLOAK_URL: http://host.docker.internal:8081
          KEYCLOAK_HTTPS_URL: https://host.docker.internal:8444
          # Test stack maps MailHog's web UI/API to host port 8026 by default
          # (docker-compose.test.yml) so it can run alongside the dev stack (8025).
          MAILHOG_URL: http://localhost:8026
        run: |
          echo "============================================"
          echo "Running E2E tests with ${{ matrix.browser }} (${{ matrix.auth_method }})${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }}"
          echo "============================================"
          EXTRA_ARGS="${{ matrix.grep_filter && format('--grep "{0}"', matrix.grep_filter) || '' }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}"
          EXTRA_ARGS=$(echo "$EXTRA_ARGS" | xargs)
          if [ -n "$EXTRA_ARGS" ]; then
            npm run ${{ matrix.npm_script }} -- $EXTRA_ARGS
          else
            npm run ${{ matrix.npm_script }}
          fi

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results-${{ strategy.job-index }}-${{ matrix.browser }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-${{ matrix.auth_method }}
          path: |
            frontend/tests/e2e/test-results/
            frontend/tests/e2e/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop test services
        if: always()
        run: |
          COMPOSE="docker compose -f docker-compose.test.yml -f docker-compose.test.ci.yml"
          PROFILE="${{ matrix.compose_profiles }}"
          $COMPOSE $PROFILE down -v

  # One Discord ping after the whole E2E matrix finishes (not per shard).
  # merge-multiple must stay false: every shard uploads reports/results.json at
  # the same relative path — merging would overwrite and under-count flakes.
  e2e-flaky-notify:
    name: Notify flaky E2E (Discord)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always() && needs.e2e.result != 'cancelled'
    steps:
      - name: Download Playwright reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: playwright-results-*
          path: artifacts
          merge-multiple: false

      - name: Notify Discord if any flaky tests
        env:
          HOOK: ${{ secrets.DISCORD_E2E_FLAKY_WEBHOOK }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "${HOOK:-}" ] || exit 0
          mapfile -t REPORTS < <(find artifacts -type f -name results.json 2>/dev/null | sort || true)
          [ "${#REPORTS[@]}" -gt 0 ] || exit 0

          # project · file · title — file avoids collapsing distinct tests with the same title
          LIST=$(jq -r '
            .. | objects
            | select((.specs? | type) == "array")
            | . as $suite
            | .specs[]?
            | . as $spec
            | .tests[]?
            | select(.status == "flaky")
            | "• " + (.projectName // "?")
              + " · " + ($suite.file // $suite.title // "?")
              + " · " + ($spec.title // "?")
          ' "${REPORTS[@]}" | sort -u)
          [ -n "$LIST" ] || exit 0

          N=$(printf '%s\n' "$LIST" | wc -l | tr -d ' ')
          SHOWN=$(printf '%s\n' "$LIST" | head -15)
          EXTRA=$(( N > 15 ? N - 15 : 0 ))
          [ "$EXTRA" -gt 0 ] && SHOWN=$(printf '%s\n… and %s more' "$SHOWN" "$EXTRA")

          # Match DiscordNotificationService embed shape (title/fields/footer/timestamp).
          # Field values max 1024; keep the flaky list under that.
          PAYLOAD=$(jq -n \
            --arg branch "$BRANCH" \
            --arg url "$RUN_URL" \
            --arg n "$N" \
            --arg list "$SHOWN" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: ("⚠️ Flaky E2E: " + $n + " test(s)"),
                color: 16776960,
                fields: [
                  { name: "Branch", value: ("`" + $branch + "`"), inline: true },
                  { name: "Count", value: $n, inline: true },
                  { name: "Flaky tests", value: ($list | .[0:1000]), inline: false },
                  { name: "CI run", value: ("[Open CI run](" + $url + ")"), inline: false }
                ],
                footer: { text: "Synaplan CI" },
                timestamp: $ts
              }]
            }')

          curl --fail-with-body --silent --show-error --retry 3 \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$HOOK" \
            || echo "::warning::Discord notification failed"

  e2e-visual:
    # Layer 3 of the UI guard: hard-capped visual snapshots (@visual project).
    # Skips gracefully while no baselines are committed — generate them with
    # the "Update visual baselines" workflow dispatch (same runner image,
    # never from a laptop).
    name: E2E Visual Snapshots
    # MUST match the runner used by visual-baselines.yml — snapshots are
    # rendering-environment sensitive.
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      APP_IMAGE: synaplan-test:ci
      APP_URL: http://localhost:8001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for committed baselines
        id: baselines
        run: |
          if compgen -G "frontend/tests/e2e/tests/*-snapshots" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No visual baselines committed yet — skipping (run the 'Update visual baselines' dispatch to create them)."
          fi

      - name: Download Docker image artifact
        if: steps.baselines.outputs.exists == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        if: steps.baselines.outputs.exists == 'true'
        run: |
          docker load -i /tmp/docker-image.tar
          IMAGE_TAG=$(docker images --format "{{.Repository}}:{{.Tag}}" | head -n 1)
          docker tag $IMAGE_TAG synaplan-test:ci

      - name: Start test services
        if: steps.baselines.outputs.exists == 'true'
        run: |
          COMPOSE="docker compose -f docker-compose.test.yml -f docker-compose.test.ci.yml"
          n=0; until $COMPOSE pull; do n=$((n+1)); [ "$n" -ge 4 ] && exit 1; sleep $((n*15)); done
          $COMPOSE up -d
          $COMPOSE up --wait || { $COMPOSE ps; $COMPOSE logs; exit 1; }

      - name: Setup Node.js
        if: steps.baselines.outputs.exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright dependencies
        if: steps.baselines.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: steps.baselines.outputs.exists == 'true'
        working-directory: frontend
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium

      - name: Run visual snapshot tests
        if: steps.baselines.outputs.exists == 'true'
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8001
        run: npm run test:e2e:visual

      - name: Upload results
        if: always() && steps.baselines.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results-visual
          path: |
            frontend/tests/e2e/test-results/
            frontend/tests/e2e/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop test services
        if: always() && steps.baselines.outputs.exists == 'true'
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.test.ci.yml down -v

  docker-push-amd64:
    name: Publish amd64 Image
    runs-on: ubuntu-latest
    # The amd64 tar produced by docker-build is the exact image E2E ran
    # against, so publishing that tar — rather than rebuilding — is what makes
    # the released image the tested one. Nothing is built here, which is why
    # the job needs neither a checkout nor the frontend artifacts.
    #
    # Runs in parallel with docker-push-arm64; docker-manifest joins the two.
    needs: [lint, mobile-tooling, backend, frontend-build, frontend-checks, docker-build, e2e, e2e-visual]
    # Only publish green main pushes and release tags.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    outputs:
      # Digest-pinned reference to the temporary tag, consumed by
      # docker-manifest so the release manifest can only ever be built from
      # the image this job actually pushed.
      ref: ${{ steps.amd64.outputs.ref }}
      digest: ${{ steps.amd64.outputs.digest }}

    steps:
      - name: Download tested amd64 image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-image
          path: /tmp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested amd64 image
        id: amd64
        env:
          TESTED_IMAGE_TAGS: ${{ needs.docker-build.outputs.image-tags }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker load -i /tmp/docker-image.tar
          source_tag="$(printf '%s\n' "$TESTED_IMAGE_TAGS" | sed -n '/./{p;q;}')"
          [ -n "$source_tag" ] || {
            echo "::error::docker-build did not provide a tested image tag"
            exit 1
          }

          temporary_tag="${REGISTRY_IMAGE}:ci-${GITHUB_SHA}-amd64"
          docker tag "$source_tag" "$temporary_tag"
          docker push "$temporary_tag"
          digest="$(
            docker buildx imagetools inspect "$temporary_tag" \
              --format '{{ .Manifest.Digest }}'
          )"
          echo "ref=${temporary_tag}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  docker-push-arm64:
    name: Publish arm64 Image
    # A native arm64 runner, not linux/arm64 under QEMU on an x86 host: the
    # emulated build took 157-173s and was the single longest step of the
    # release path.
    #
    # These runners are free and unlimited for PUBLIC repositories only. If
    # this repository ever becomes private the label stops resolving and the
    # job queues indefinitely — switch to an arm64 larger runner then.
    runs-on: ubuntu-24.04-arm
    # The same gates and the same publish condition as the amd64 job: arm64 is
    # still built only once every check is green, and only for main pushes and
    # release tags.
    needs: [lint, mobile-tooling, backend, frontend-build, frontend-checks, docker-build, e2e, e2e-visual]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.arm64.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Dockerfile COPYs both into the image. They are plain JS/CSS and
      # therefore architecture independent, so the arm64 image ships exactly
      # the assets the amd64 image was tested with instead of a second build.
      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Download widget build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: widget-dist
          path: frontend/dist-widget/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are consumed here — the release tags are applied by
      # docker-manifest, which is the one job allowed to move them.
      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Prevent metadata-action's SemVer flavor from moving latest on tags.
          flavor: latest=false
          tags: |
            # Only the default branch moves latest.
            type=raw,value=latest,enable={{is_default_branch}}
            # Release tags vX.Y.Z publish the immutable version and aliases.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push arm64 image
        id: arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: _docker/backend/Dockerfile
          # Native on this runner, so there is no setup-qemu-action above.
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-arm64
          labels: ${{ steps.meta.outputs.labels }}
          # Resolved once by docker-build, so both architectures report the
          # same APP_VERSION even if a tag lands mid-run.
          build-args: |
            APP_VERSION=${{ needs.docker-build.outputs.app-version }}
          # Separate scope from the amd64 build: the layer sets share nothing,
          # so one scope would just evict the other from the 10 GB cache.
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  docker-manifest:
    name: Publish Multi-Arch Manifest
    runs-on: ubuntu-latest
    # Joins the tested amd64 image and the native arm64 build under the release
    # tags. This is the only job that moves a release tag, and it is also the
    # one that proves the result: the verification below refuses any tag that
    # does not resolve to exactly the two digests published above.
    needs: [docker-build, docker-push-amd64, docker-push-arm64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    outputs:
      # The version release-manifest advertises. Resolved by docker-build and
      # baked into both images, so the manifest can only ever name the version
      # that was actually published — never the mutable `latest` tag.
      version: ${{ needs.docker-build.outputs.app-version }}
      # Multi-arch manifest digest of the tags that were just published and
      # verified. The Umbrel package pins tag@digest; the release-version-pin
      # job writes this value into deploy/umbrel/ so a new store submission
      # never invents a digest of its own.
      digest: ${{ steps.release.outputs.digest }}

    steps:
      # Only for scripts/resolve-manifest-digest.sh, which both steps below use.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Prevent metadata-action's SemVer flavor from moving latest on tags.
          flavor: latest=false
          tags: |
            # Only the default branch moves latest.
            type=raw,value=latest,enable={{is_default_branch}}
            # Release tags vX.Y.Z publish the immutable version and aliases.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        id: release
        env:
          AMD64_REF: ${{ needs.docker-push-amd64.outputs.ref }}
          TESTED_AMD64_DIGEST: ${{ needs.docker-push-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.docker-push-arm64.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          arm64_ref="${REGISTRY_IMAGE}@${ARM64_DIGEST}"
          manifest_digest=""

          while IFS= read -r image; do
            [ -n "$image" ] || continue
            docker buildx imagetools create \
              --tag "$image" \
              "$AMD64_REF" \
              "$arm64_ref"
            # Not a plain tag lookup: GHCR can still answer a tag from cache
            # right after the push, and this digest leaves the job as the
            # release digest the Umbrel pin is built from.
            current_digest="$(
              scripts/resolve-manifest-digest.sh \
                "$image" "$TESTED_AMD64_DIGEST" "$ARM64_DIGEST"
            )"
            if [ -z "$manifest_digest" ]; then
              manifest_digest="$current_digest"
            elif [ "$current_digest" != "$manifest_digest" ]; then
              echo "::error::${image} resolved to ${current_digest}, expected ${manifest_digest}"
              exit 1
            fi
          done <<< "$IMAGE_TAGS"

          [ -n "$manifest_digest" ] || {
            echo "::error::No release tags were generated"
            exit 1
          }
          echo "digest=${manifest_digest}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest and platforms
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          TESTED_AMD64_DIGEST: ${{ needs.docker-push-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.docker-push-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          expected='["linux/amd64","linux/arm64"]'

          while IFS= read -r image; do
            [ -n "$image" ] || continue
            echo "Verifying ${image}"

            resolved_digest="$(
              scripts/resolve-manifest-digest.sh \
                "$image" "$TESTED_AMD64_DIGEST" "$ARM64_DIGEST"
            )"
            if [ "$resolved_digest" != "$IMAGE_DIGEST" ]; then
              echo "::error::${image} resolved to ${resolved_digest}, expected ${IMAGE_DIGEST}"
              exit 1
            fi

            platforms="$(
              docker buildx imagetools inspect --raw "$image" |
                jq -c '[.manifests[].platform
                  | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
                  | "\(.os)/\(.architecture)"] | unique | sort'
            )"
            if [ "$platforms" != "$expected" ]; then
              echo "::error::${image} exposes ${platforms}, expected ${expected}"
              exit 1
            fi

            raw_manifest="$(docker buildx imagetools inspect --raw "$image")"
            amd64_digest="$(
              jq -r '.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == "amd64")
                | .digest' <<< "$raw_manifest"
            )"
            arm64_digest="$(
              jq -r '.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == "arm64")
                | .digest' <<< "$raw_manifest"
            )"
            if [ "$amd64_digest" != "$TESTED_AMD64_DIGEST" ]; then
              echo "::error::${image} amd64 digest ${amd64_digest} is not the tested ${TESTED_AMD64_DIGEST}"
              exit 1
            fi
            if [ "$arm64_digest" != "$ARM64_DIGEST" ]; then
              echo "::error::${image} arm64 digest ${arm64_digest} is not the built ${ARM64_DIGEST}"
              exit 1
            fi
          done <<< "$IMAGE_TAGS"

          # Also verify the immutable digest directly, independent of tag lookup.
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"

  release-manifest:
    name: Publish Release Manifest
    runs-on: ubuntu-latest
    # An instance learns that a newer release exists from versions.json, so the
    # manifest must never exist before the image it names. docker-manifest
    # completes only after the multi-arch manifest was created AND verified to
    # expose both platforms at the tested digests, which makes it the earliest
    # point where advertising the version is honest.
    needs: [docker-manifest]
    # Release tags only. A main push publishes `latest`, which is not a release,
    # and a pull request publishes nothing at all.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      # The only write privilege in this workflow, and only for the push below.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing but scripts/release-manifest.mjs is used from this checkout,
          # and the push below authenticates through its own remote URL, so no
          # writable token belongs in .git/config.
          persist-credentials: false

      - name: Publish versions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.docker-manifest.outputs.version }}
          # NOT main, and this is the reason the branch exists: Elestio pipelines
          # track main and redeploy on every commit, so a manifest commit there
          # would restart every managed instance on every release. The branch
          # holds versions.json on an orphan history and nothing else, which also
          # keeps it out of diffs, release archives and CI runs on main.
          BRANCH: release-manifest
        run: |
          set -euo pipefail

          # docker/metadata-action derives {{version}} from the tag. Cross-check
          # it against the ref so a change in that derivation cannot shift the
          # advertised version away from the tag that was actually published.
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Published version ${VERSION} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

          # A pre-release (v5.0.0-rc.1) is a legitimate deployment pin, but it
          # must never become `stable` — so it publishes nothing instead of
          # failing the release run. The generator refuses one as a backstop.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a plain release; no manifest is published." |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          work_dir="$(mktemp -d)"
          branch_dir="$work_dir/branch"
          mkdir -p "$branch_dir"
          git -C "$branch_dir" init -q -b "$BRANCH"
          git -C "$branch_dir" config user.name 'github-actions[bot]'
          git -C "$branch_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$branch_dir" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          manifest=(--version "$VERSION" --repository "$GITHUB_REPOSITORY")
          if git -C "$branch_dir" fetch -q --depth 1 origin "refs/heads/${BRANCH}"; then
            git -C "$branch_dir" reset -q --hard FETCH_HEAD
            # The current manifest is read from OUTSIDE the work tree: the
            # generator's stdout is redirected onto versions.json, which
            # truncates the file before it could be read in place — and its
            # `yanked` list has to survive this release.
            if [ -f "$branch_dir/versions.json" ]; then
              cp "$branch_dir/versions.json" "$work_dir/existing.json"
              manifest+=(--existing "$work_dir/existing.json")
            fi
          else
            echo "Branch ${BRANCH} does not exist yet; this push creates it."
          fi

          node scripts/release-manifest.mjs "${manifest[@]}" > "$branch_dir/versions.json"

          git -C "$branch_dir" add versions.json
          # Re-running the same tag produces the same manifest, so there is
          # nothing to commit — the job is idempotent and safe to re-run.
          if git -C "$branch_dir" diff --quiet --cached; then
            echo "versions.json is already up to date; nothing was published." |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$branch_dir" commit -q -m "chore(release): publish versions.json for ${VERSION}"
          git -C "$branch_dir" push -q origin "HEAD:refs/heads/${BRANCH}"

          {
            echo "Published \`versions.json\` on \`${BRANCH}\`:"
            echo ''
            echo '```json'
            cat "$branch_dir/versions.json"
            echo '```'
            echo ''
            echo "A security release is marked by editing \`severity\` to" \
              "\`security\` on \`${BRANCH}\`; the next release resets it, which is" \
              "correct — the field describes that release."
          } >> "$GITHUB_STEP_SUMMARY"

  release-version-pin:
    name: Update the Default Release Version
    runs-on: ubuntu-latest
    # elestio.yml, deploy/selfhost.env.example, deploy/umbrel/synaplan/ and the
    # AWS Packer template decide which version a NEW deployment installs, so
    # they may only ever name a release whose image is published and verified —
    # which is what docker-manifest guarantees. Umbrel also needs the digest of
    # that image.
    needs: [docker-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      pull-requests: write

    steps:
      # A pull request, deliberately, rather than a push to main. Elestio
      # pipelines redeploy on every commit to the branch they track, so pushing
      # here would restart every managed instance at an unpredictable moment.
      # Merging is the maintainer's choice of when that happens. The Umbrel
      # package lives in this same PR so a release bumps every catalog pin
      # together; the getumbrel/umbrel-apps store submission stays a separate,
      # manual step because it targets a foreign repository.
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The secrets context is not available in an `if` expression, so their
      # presence is carried through an output — the same workaround release-tag.yml
      # uses.
      - name: Check pull request credentials
        id: config
        env:
          APP_ID: ${{ secrets.MOBILE_TAG_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.MOBILE_TAG_APP_PRIVATE_KEY }}
        run: |
          if test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Refs created with the default GITHUB_TOKEN do not start workflow runs,
      # so a pull request opened with it would carry no checks at all. The same
      # app that creates release tags is used here for the same reason; without
      # it the proposal is still opened, just unchecked.
      - name: Create pull request token
        id: app-token
        if: steps.config.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MOBILE_TAG_APP_ID }}
          private-key: ${{ secrets.MOBILE_TAG_APP_PRIVATE_KEY }}

      - name: Propose the new default version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.docker-manifest.outputs.version }}
          DIGEST: ${{ needs.docker-manifest.outputs.digest }}
          BRANCH: automation/default-release-version
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Same cross-check as the manifest job: the advertised default must be
          # the tag that was actually published, whatever metadata-action does.
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Published version ${VERSION} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

          # A pre-release is a valid pin for someone who types it in, but never
          # the default a new deployment installs.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a plain release; the default version is unchanged." |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$DIGEST" ]; then
            echo "::error::docker-manifest did not provide the multi-arch manifest digest; Umbrel cannot be pinned without it"
            exit 1
          fi

          node scripts/set-release-version.mjs --version "$VERSION" --digest "$DIGEST"

          if git diff --quiet; then
            echo "The default version is already \`${VERSION}\`; nothing to propose." |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B "$BRANCH"
          git commit -qam "chore(release): install ${VERSION} in new deployments"

          # Force-push the fixed branch: if an earlier release's proposal is
          # still open, it is carried forward to the newest release rather than
          # leaving two competing pull requests behind.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // ""')"
          if [ -n "$existing" ]; then
            echo "Updated [pull request #${existing}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${existing}) to \`${VERSION}\`." |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Installs \`${VERSION}\` in **new** deployments:

          - \`elestio.yml\` for the one-click path
          - \`deploy/selfhost.env.example\` for self-hosting
          - \`deploy/umbrel/synaplan/\` for the Umbrel App Store package
            (version, \`APP_VERSION\`, and the published image digest
            \`${DIGEST}\`)
          - \`deploy/aws/packer/synaplan.pkr.hcl\` for the AWS Marketplace AMI

          Existing deployments are unaffected. They keep the version their operator
          pinned and change it only by following the update guide, so a redeploy never
          moves a running installation to a different version.

          Merging this restarts every Elestio instance that tracks \`${BASE}\`, because
          Elestio redeploys on each commit to the branch it tracks. Merge when that is
          convenient.

          The Umbrel pin lives in this repository only. Submitting the raised package
          to [getumbrel/umbrel-apps](https://github.com/getumbrel/umbrel-apps) remains
          a separate, manual pull request.

          Opened automatically after the image for \`${GITHUB_REF_NAME}\` was published
          and verified.
          EOF

          # The branch above already carries the change, so the release itself is
          # complete and verified at this point. Opening the proposal needs
          # `Pull requests: write` on top of that, which the token does not
          # necessarily carry: the release App is scoped to Contents, and
          # GITHUB_TOKEN cannot open pull requests while the organization
          # forbids it. Report the branch instead of marking a published release
          # as failed — this step proposes a convenience, it does not gate.
          error_file="$(mktemp)"
          if url="$(gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore(release): install ${VERSION} in new deployments" \
            --body-file "$body_file" 2>"$error_file")"; then
            echo "Opened ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::Could not open the default-version pull request: $(tr '\n' ' ' < "$error_file")"
          {
            echo "Branch \`${BRANCH}\` was updated to \`${VERSION}\`, but its pull request could not be opened automatically."
            echo ""
            echo "Open it from [this comparison](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE}...${BRANCH}?expand=1)," \
              "or grant the release App \`Pull requests: write\` so the proposal opens by itself."
          } >> "$GITHUB_STEP_SUMMARY"

  cloudflare-deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    # Same rationale as the publish jobs: never deploy while tests/checks fail.
    needs: [e2e, backend, frontend-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Deploy to Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

  # cloudflare-deploy only runs on push to main/tags, so dependency bumps in
  # cloudflare/ (wrangler, workers-types and their transitive miniflare) are
  # never exercised on a PR. This job bundles the Worker via `wrangler --dry-run`
  # (esbuild build, no upload, no secrets required) so those updates are
  # validated before merge instead of failing at deploy time.
  cloudflare-check:
    name: Cloudflare Worker Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Validate Worker build (dry-run)
        working-directory: cloudflare
        run: npx wrangler deploy --env production --dry-run --outdir dist

  # Gate job that depends on all checks - only this needs to be required in branch protection
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, deployment-templates, mobile-tooling, backend, frontend-build, frontend-checks, docker-build, e2e, e2e-visual, docker-push-amd64, docker-push-arm64, docker-manifest, release-manifest, release-version-pin, cloudflare-deploy, cloudflare-check]
    if: always()
    steps:
      - name: Check for failures
        if: |
          !cancelled() && (
            needs.lint.result != 'success' ||
            needs.deployment-templates.result != 'success' ||
            needs.mobile-tooling.result != 'success' ||
            needs.backend.result != 'success' ||
            needs.frontend-build.result != 'success' ||
            needs.frontend-checks.result != 'success' ||
            needs.docker-build.result != 'success' ||
            needs.e2e.result != 'success' ||
            needs.e2e-visual.result != 'success' ||
            (needs.docker-push-amd64.result != 'success' && needs.docker-push-amd64.result != 'skipped') ||
            (needs.docker-push-arm64.result != 'success' && needs.docker-push-arm64.result != 'skipped') ||
            (needs.docker-manifest.result != 'success' && needs.docker-manifest.result != 'skipped') ||
            (needs.release-manifest.result != 'success' && needs.release-manifest.result != 'skipped') ||
            (needs.release-version-pin.result != 'success' && needs.release-version-pin.result != 'skipped') ||
            (needs.cloudflare-deploy.result != 'success' && needs.cloudflare-deploy.result != 'skipped') ||
            (needs.cloudflare-check.result != 'success' && needs.cloudflare-check.result != 'skipped')
          )
        run: |
          echo "One or more checks failed, were cancelled, or were skipped"
          exit 1

      - name: All checks passed
        run: echo "All checks passed!"
