name: Mobile Release Artifacts

# Publishing a GitHub release is the signal that a state should reach the
# mobile apps. Tags alone (platform versioning, Docker images) do not start the
# chain: this workflow runs only on `release: published`, classifies everything
# merged since the previously published release, and dispatches the apps
# synchronization when the classification reaches the app.
#
# release-publish.yml raises that signal automatically, the moment a release
# tag's own CI run goes green — publishing is no longer a manual click, but
# this workflow's own trigger and guarantees are unchanged either way: it only
# ever reacts to an already-published release, whoever or whatever published
# it.
on:
  release:
    types: [published]

concurrency:
  group: mobile-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish mobile manifest
    # Pre-releases are reserved for future canary work and never reach the apps.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          # This job checks out the release commit (privileged context) and runs
          # tooling from it, so never leave the base-repo token in .git/config.
          # All git use here is read-only; authenticated calls use an explicit
          # token via `gh api`.
          persist-credentials: false

      - name: Resolve and verify the release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}([+-][0-9A-Za-z.-]+)?$ ]]
          echo "RELEASE_SHA=$(git rev-list -n 1 "$RELEASE_TAG")" >> "$GITHUB_ENV"

      - name: Require a green CI run for the release commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A release can be published on any tag, so nothing guarantees the
          # commit passed CI. Refuse to ship an unverified commit, and reuse the
          # successful run as the source of the commit-matching OpenAPI artifact.
          #
          # The API filters on head_sha, but it ignores an unknown query
          # parameter silently, which would widen this to "any green CI run".
          # The commit is therefore matched again on the returned run.
          run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&status=success&per_page=100" |
              jq -r --arg sha "$RELEASE_SHA" \
                '[.workflow_runs[] | select(.name == "CI" and .event == "push" and .head_sha == $sha)]
                  | first | .id // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "::error::No successful CI run exists for ${RELEASE_SHA} — refusing to release an unverified commit."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download commit-matching OpenAPI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci-run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p mobile-release
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "openapi-spec" and .expired == false) | .id' |
              head -n 1
          )"
          if [ -z "$artifact_id" ]; then
            echo "::error::The CI run for ${RELEASE_SHA} carries no unexpired openapi-spec artifact. Re-run CI for this commit and publish the release again."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/openapi.zip
          unzip -q /tmp/openapi.zip -d mobile-release
          test -s mobile-release/openapi-spec.json

      - name: Resolve the previously published release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The classification aggregates everything since the last release that
          # actually reached this chain, so the diff base is the newest published
          # (non-draft, non-prerelease) release whose commit is an ancestor —
          # not just the newest tag, because tags alone no longer ship.
          base_ref=''
          while IFS= read -r candidate; do
            [ "$candidate" = "$RELEASE_TAG" ] && continue
            candidate_sha="$(git rev-list -n 1 "$candidate" 2>/dev/null || true)"
            [ -z "$candidate_sha" ] && continue
            [ "$candidate_sha" = "$RELEASE_SHA" ] && continue
            if git merge-base --is-ancestor "$candidate_sha" "$RELEASE_SHA"; then
              base_ref="$candidate"
              break
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if [ -z "$base_ref" ]; then
            base_ref="$(git rev-list --max-parents=0 "$RELEASE_SHA")"
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "Classifying ${RELEASE_TAG} against ${base_ref}." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate mobile release manifest
        id: manifest
        env:
          BASE_REF: ${{ steps.previous.outputs.base_ref }}
        run: |
          set -euo pipefail
          node scripts/mobile-impact.mjs \
            --base "$BASE_REF" \
            --head "$RELEASE_SHA" \
            --tag "$RELEASE_TAG" \
            --api-contract mobile-release/openapi-spec.json \
            --output mobile-release/mobile-release-manifest.json
          test -s mobile-release/mobile-release-manifest.json
          classification="$(jq -r '.classification' mobile-release/mobile-release-manifest.json)"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          if [[ "$classification" == "ota-candidate" || "$classification" == "store-required" ]]; then
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          fi
          (
            cd mobile-release
            sha256sum openapi-spec.json mobile-release-manifest.json > checksums.sha256
          )

      - name: Upload mobile release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-release-${{ env.RELEASE_TAG }}-${{ env.RELEASE_SHA }}
          path: mobile-release/
          if-no-files-found: error
          retention-days: 90

      - name: Attest release checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: mobile-release/checksums.sha256

      - name: Check dispatch credentials
        id: dispatch-config
        env:
          APP_ID: ${{ secrets.MOBILE_APPS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.MOBILE_APPS_APP_PRIVATE_KEY }}
        run: |
          if test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app-token
        if: steps.dispatch-config.outputs.configured == 'true' && steps.manifest.outputs.needs_sync == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MOBILE_APPS_APP_ID }}
          private-key: ${{ secrets.MOBILE_APPS_APP_PRIVATE_KEY }}
          owner: metadist
          repositories: synaplan-apps

      - name: Dispatch apps synchronization
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # A repository dispatch would need Contents write on the private app
          # repository, and this key lives in a PUBLIC repository. Starting the
          # workflow directly needs only Actions write, so a leak cannot push code.
          gh api --method POST \
            repos/metadist/synaplan-apps/actions/workflows/sync-synaplan.yml/dispatches \
            -f ref=main \
            -f "inputs[synaplan_ref]=$RELEASE_TAG" \
            -f "inputs[synaplan_sha]=$RELEASE_SHA" \
            -f "inputs[source_run_id]=${{ github.run_id }}"

      - name: Report skipped dispatch
        if: steps.manifest.outputs.needs_sync == 'true' && steps.app-token.outcome == 'skipped'
        run: |
          echo "Mobile artifacts were published. Repository dispatch was skipped because GitHub App credentials are not configured." |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report release without app impact
        if: steps.manifest.outputs.needs_sync == 'false'
        env:
          CLASSIFICATION: ${{ steps.manifest.outputs.classification }}
        run: |
          echo "Classification \`${CLASSIFICATION}\` does not require an apps synchronization PR." |
            tee -a "$GITHUB_STEP_SUMMARY"
