name: Mobile Impact

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: mobile-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify mobile release impact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Generate fail-closed impact manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # Classify exactly the commit this event was raised for, fetched by
          # its SHA. Fetching refs/pull/<n>/head instead loses two races:
          # GitHub publishes that ref a few seconds after the event (the fetch
          # fails with "couldn't find remote ref"), and a push right after the
          # PR is opened moves the ref past HEAD_SHA before this job reads it,
          # so the equality guard failed a run for a commit nobody tampered
          # with — and did so without a word in the log. A commit fetched by
          # SHA is by construction the one in the event; GitHub serves it even
          # after a force-push has moved the branch on. The retry only covers
          # replication delay between the push and the git backend.
          for attempt in 1 2 3 4 5 6; do
            if git fetch --no-tags origin "$HEAD_SHA"; then
              break
            fi
            echo "commit ${HEAD_SHA} not available yet (attempt ${attempt}), retrying in 5s..." >&2
            sleep 5
          done
          # Fail closed, and say why, if the commit never arrived.
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::commit ${HEAD_SHA} (head of pull request #${PR_NUMBER} when this run was triggered) never became available" >&2
            exit 1
          fi
          # Bootstrap-only: the classifier tooling is checked out from the base
          # branch (fail-closed against PR tampering), but the PR that first
          # introduces the tooling has no copy on base yet. Materialize it from
          # the event's commit just for that case. Once merged to main this
          # branch is dead code, because base always carries the files.
          if [ ! -f scripts/mobile-impact.mjs ]; then
            mkdir -p scripts .github
            git show "${HEAD_SHA}:scripts/mobile-impact.mjs" > scripts/mobile-impact.mjs
            git show "${HEAD_SHA}:.github/mobile-impact-policy.json" > .github/mobile-impact-policy.json
          fi
          mkdir -p mobile-impact
          args=(
            --base "$BASE_SHA"
            --head "$HEAD_SHA"
            --output mobile-impact/manifest.json
          )
          while IFS= read -r label; do
            args+=(--label "$label")
          done < <(jq -r '.[]' <<< "$LABELS_JSON")
          node scripts/mobile-impact.mjs "${args[@]}"
          jq -r \
            '"### Mobile impact: `\(.classification)`\n\n\(.reason)\n\nChanged files: \(.files | length)"' \
            mobile-impact/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload impact manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-impact-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: mobile-impact/manifest.json
          if-no-files-found: error
          retention-days: 14
