# Paths that hold the fakes in dummy-secrets.allow, and the suites that use
# them. Secret scanning closes alerts for these paths and push protection
# skips them. Everywhere else stays scanned, including .env.example: a real
# key pasted over a placeholder must still alert.
#
# TimingDummyHash.php is the only production file on this list. It contains
# the two timing hashes and nothing else.
paths-ignore:
  - ".github/dummy-secrets.allow"
  - "backend/src/Security/TimingDummyHash.php"
  - "backend/tests/**"
  - "frontend/tests/**"
  - "backend/.env.test"
  - "backend/phpunit.xml.dist"
