name: "${COMPOSE_PROJECT_NAME:-synaplan}"

x-app-image: &app-image "${SYNAPLAN_IMAGE:-ghcr.io/metadist/synaplan}:${SYNAPLAN_VERSION:?Set SYNAPLAN_VERSION to a published compatible immutable SemVer release}"
x-app-command: &app-command
  - |
    # COMPOSE_PROFILES is a comma-separated list, so the profile is matched as a
    # list ELEMENT. An equality test against the whole value made
    # "local-ai,anything" start Ollama — Compose does read the list — while
    # leaving the app roles pointed at no local AI at all: a stack that looks
    # enabled and silently answers from the cloud provider instead.
    case ",$${COMPOSE_PROFILES:-}," in
      *,local-ai,*)
        export OLLAMA_BASE_URL=http://ollama:11434
        export AUTO_DOWNLOAD_MODELS=true
        export WHISPER_ENABLED=true
        ;;
      *)
        export OLLAMA_BASE_URL=
        export AUTO_DOWNLOAD_MODELS=false
        export WHISPER_ENABLED=false
        ;;
    esac
    case ",$${COMPOSE_PROFILES:-}," in
      *,office,*)
        export OFFICE_CONVERT_URL=http://collabora:9980
        ;;
    esac
    exec /usr/local/bin/docker-entrypoint.sh
x-app-environment: &app-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  # Deployment hint for the release notice: it decides which manual-update guide
  # the admin UI links to. Optional — an unset or unknown value means the
  # self-hosted guide, so nothing breaks when a deployment never sets it.
  SYNAPLAN_PLATFORM: "${SYNAPLAN_PLATFORM:-selfhost}"
  # The version the operator pinned. Overrides the value baked into the image so
  # the sidebar and the update check always show the release that is actually
  # configured — never a mutable registry tag such as `latest` that an older
  # image build may have recorded as APP_VERSION.
  APP_VERSION: "${SYNAPLAN_VERSION}"
  APP_URL: "${APP_URL:?Set APP_URL to the public HTTPS URL}"
  FRONTEND_URL: "${FRONTEND_URL:?Set FRONTEND_URL to the public HTTPS URL}"
  APP_SECRET: "${APP_SECRET:?Set a stable APP_SECRET}"
  TOKEN_SECRET: "${TOKEN_SECRET:?Set a stable TOKEN_SECRET}"
  # Empty means the Secure flag follows the APP_URL scheme, which is what every
  # deployment following selfhost.env.example wants. Only a deployment whose TLS
  # terminates where APP_URL cannot show it needs an explicit value.
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-}"
  BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
  BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
  BOOTSTRAP_ADMIN_FORCE_PASSWORD_CHANGE: "${BOOTSTRAP_ADMIN_FORCE_PASSWORD_CHANGE:-false}"
  # Auth-surface switches (issues #462 / #1517). Empty keeps the application
  # default, which is enabled, so an existing deployment is unaffected. An
  # install reachable from the open internet that nobody watches wants
  # registration off; SSO-/OIDC-only deployments set both to "false".
  REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-}"
  GUEST_CHAT_ENABLED: "${GUEST_CHAT_ENABLED:-}"
  # First-run setup wizard. Empty keeps it enabled, which is what a deployment
  # without BOOTSTRAP_ADMIN_* needs: the API stays closed with 503 SETUP_REQUIRED
  # until someone creates the first administrator at /setup. It never appears once
  # the installation has a user, so an upgrade is unaffected either way.
  SETUP_WIZARD_ENABLED: "${SETUP_WIZARD_ENABLED:-}"
  # Browser-side (cloud-backed) speech-to-text; air-gapped deployments set "false".
  WEB_SPEECH_ENABLED: "${WEB_SPEECH_ENABLED:-}"
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: "${MARIADB_DATABASE:-synaplan}"
  DB_USER: "${MARIADB_USER:-synaplan}"
  DB_PASSWORD: "${MARIADB_PASSWORD:?Set a stable MariaDB application password}"
  DB_SERVER_VERSION: mariadb-12.3.2
  REDIS_DSN: redis://redis:6379
  LOCK_DSN: redis://redis:6379
  REALTIME_ENABLED: "true"
  REALTIME_API_URL: http://centrifugo:8000/api
  REALTIME_API_KEY: "${REALTIME_API_KEY:?Set a stable Centrifugo API key}"
  REALTIME_TOKEN_SECRET: "${REALTIME_TOKEN_SECRET:?Set a stable Centrifugo token secret}"
  REALTIME_PUBLIC_WS_URL: ""
  REALTIME_ALLOWED_ORIGINS: "${REALTIME_ALLOWED_ORIGINS:-${APP_URL}}"
  QDRANT_URL: http://qdrant:6333
  TIKA_BASE_URL: http://tika:9998
  # Empty until the `office` profile sets it in x-app-command.
  OFFICE_CONVERT_URL: "${OFFICE_CONVERT_URL:-}"
  OFFICE_CONVERT_TIMEOUT_MS: "${OFFICE_CONVERT_TIMEOUT_MS:-60000}"
  COMPOSE_PROFILES: "${COMPOSE_PROFILES:-}"
  OLLAMA_BASE_URL: ""
  AUTO_DOWNLOAD_MODELS: "false"
  ENABLE_LOCAL_GPT_OSS: "${ENABLE_LOCAL_GPT_OSS:-false}"
  AI_DEFAULT_PROVIDER: "${AI_DEFAULT_PROVIDER:-groq}"
  WHISPER_BINARY: /usr/local/bin/whisper
  WHISPER_MODELS_PATH: /var/www/backend/var/whisper
  WHISPER_DEFAULT_MODEL: "${WHISPER_DEFAULT_MODEL:-tiny}"
  WHISPER_ENABLED: "false"
  FFMPEG_BINARY: /usr/bin/ffmpeg
  MAILER_DSN: "${MAILER_DSN:-null://null}"
  APP_SENDER_EMAIL: "${APP_SENDER_EMAIL:-}"
  APP_SENDER_NAME: "${APP_SENDER_NAME:-Synaplan}"
  PHP_MAX_FILE_UPLOADS: "${PHP_MAX_FILE_UPLOADS:-100}"
  LOG_FORMAT: "${LOG_FORMAT:-json}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  GROQ_API_KEY: "${GROQ_API_KEY:-}"
  GOOGLE_GEMINI_API_KEY: "${GOOGLE_GEMINI_API_KEY:-}"
  MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
  XAI_API_KEY: "${XAI_API_KEY:-}"
  # Operator billing. Empty keys mean open-source mode: no plans, no quotas, no
  # upgrade prompts, and every tier gate open (see docs/BILLING_SELFHOST.md).
  # Setting them turns this install into a paid product run by YOU, billed
  # through YOUR Stripe account.
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
  STRIPE_PRICE_PRO: "${STRIPE_PRICE_PRO:-}"
  STRIPE_PRICE_TEAM: "${STRIPE_PRICE_TEAM:-}"
  STRIPE_PRICE_BUSINESS: "${STRIPE_PRICE_BUSINESS:-}"
  STRIPE_PAYMENT_METHODS: "${STRIPE_PAYMENT_METHODS:-}"
  STRIPE_AUTOMATIC_TAX: "${STRIPE_AUTOMATIC_TAX:-false}"
  # Per-plan spending ceiling for AI usage. Only ever enforced together with
  # Stripe, because the budget is denominated in the plan a user pays for.
  COST_BUDGET_GATE_ENABLED: "${COST_BUDGET_GATE_ENABLED:-false}"

x-app-volumes: &app-volumes
  - ./data/uploads:/var/www/backend/var/uploads
  - ./data/whisper:/var/www/backend/var/whisper:ro
  # Read-only: this directory holds every MariaDB dump and Qdrant snapshot, so
  # it carries all user data, password hashes and encrypted provider keys. The
  # backup artifacts are written by the HOST (pre-backup.sh redirects the dump
  # and each snapshot into it), and the only container-side access is
  # post-restore.sh reading one snapshot file back for upload. Mounting it
  # writable gave the internet-facing PHP container the ability to read, alter
  # or destroy the entire backup history for no functional gain.
  - ./data/backups:/var/www/backup:ro

services:
  backend:
    image: *app-image
    pull_policy: "${SYNAPLAN_PULL_POLICY:-always}"
    entrypoint: ["/bin/bash", "-ec"]
    command: *app-command
    environment:
      <<: *app-environment
      SYNAPLAN_ROLE: web
    volumes: *app-volumes
    ports:
      - "${SYNAPLAN_HTTP_BIND:-127.0.0.1}:${SYNAPLAN_HTTP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      tika:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks: [internal]

  worker:
    image: *app-image
    pull_policy: "${SYNAPLAN_PULL_POLICY:-always}"
    entrypoint: ["/bin/bash", "-ec"]
    command: *app-command
    environment:
      <<: *app-environment
      SYNAPLAN_ROLE: worker
    volumes: *app-volumes
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks: [internal]

  scheduler:
    image: *app-image
    pull_policy: "${SYNAPLAN_PULL_POLICY:-always}"
    entrypoint: ["/bin/bash", "-ec"]
    command: *app-command
    environment:
      <<: *app-environment
      SYNAPLAN_ROLE: scheduler
    volumes: *app-volumes
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks: [internal]

  db:
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    command: --max-allowed-packet=256M --innodb-buffer-pool-size=512M
    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE:-synaplan}"
      MARIADB_USER: "${MARIADB_USER:-synaplan}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?Set a stable MariaDB application password}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set a stable MariaDB root password}"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      # The password is expanded by the container's shell, so it MUST stay
      # quoted: an unquoted expansion splits a password containing whitespace
      # into several arguments, mariadb-admin never authenticates, db never turns
      # healthy, and backend, worker and scheduler wait on it forever.
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [internal]

  centrifugo:
    image: centrifugo/centrifugo:v6.9.3@sha256:017d0a3d39757f94a09efa657b6ad7e68222564dd9ba7dd7193981d75cd8a025
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${REALTIME_TOKEN_SECRET:?Set a stable Centrifugo token secret}"
      CENTRIFUGO_HTTP_API_KEY: "${REALTIME_API_KEY:?Set a stable Centrifugo API key}"
      CENTRIFUGO_ADMIN_PASSWORD: "${REALTIME_ADMIN_PASSWORD:?Set a stable Centrifugo admin password}"
      CENTRIFUGO_ADMIN_SECRET: "${REALTIME_ADMIN_SECRET:?Set a stable Centrifugo admin secret}"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${REALTIME_ALLOWED_ORIGINS:-${APP_URL}}"
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://redis:6379/3
    volumes:
      - ../_docker/centrifugo/config.json:/centrifugo/config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "centrifugo", "checkconfig", "-c", "/centrifugo/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  tika:
    image: apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    command: -h 0.0.0.0 -p 9998
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9998 && printf 'GET /version HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *'200 OK'* ]]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *'200 OK'* ]]"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [internal]

  # Optional Collabora CODE — LibreOffice convert-to. Off by default so the
  # official 8 GB self-host floor stays valid. Enable with COMPOSE_PROFILES=office
  # (or `--profile office`). No published port.
  collabora:
    image: collabora/code:25.04.10.3.1@sha256:a51dd5d1741dea5d19f49d9997de2c321bf582076015ec4015941f3f00a5f4c0
    profiles: [office]
    environment:
      extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:num_prespawn_children=2
    mem_limit: 2g
    # CODE 25.04 dropped curl (CollaboraOnline/online#11856). Same /dev/tcp
    # probe as the ollama service below; coolwsd --probe is 26.04+.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9980 && printf 'GET /hosting/capabilities HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *'200 OK'* ]]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks: [internal]

  ollama:
    image: ollama/ollama:latest@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    profiles: [local-ai]
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ./data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/11434 && printf 'GET /api/tags HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *'200 OK'* ]]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks: [internal]

  whisper-models:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    profiles: [local-ai]
    # The model name is passed as an environment variable and expanded by the
    # container's shell inside quotes, instead of being interpolated by Compose
    # into the script text. A Compose-interpolated value would become part of the
    # program: a name containing whitespace would split the arguments of `test`
    # and `curl`, and a name containing shell metacharacters would run as code.
    environment:
      WHISPER_DEFAULT_MODEL: "${WHISPER_DEFAULT_MODEL:-tiny}"
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache curl ca-certificates
        mkdir -p /models
        model="ggml-$$WHISPER_DEFAULT_MODEL.bin"
        test -s "/models/$$model" || curl -fL --retry 3 --max-time 900 \
          -o "/models/$$model" \
          "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$$model"
        chmod 0644 /models/*.bin
    volumes:
      - ./data/whisper:/models
    restart: "no"
    networks: [internal]

networks:
  internal:
    driver: bridge
