AWSTemplateFormatVersion: '2010-09-09'
# Generated by scripts/generate-aws-marketplace-templates.mjs.
# Do not edit this file directly; update the source template and regenerate.
Description: >-
  Synaplan - AI knowledge management, all-in-one on a single EC2 instance, in a
  VPC and subnet you already run. Use synaplan-new-vpc.yaml to have the stack
  create the network too.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Your network
        Parameters:
          - VpcId
          - SubnetId
          - AssignPublicIp
      - Label:
          default: Instance
        Parameters:
          - ImageId
          - InstanceType
          - DataVolumeSize
      - Label:
          default: Access
        Parameters:
          - AllowedWebCidr
          - DomainName
          - AdminEmail
          - KeyName
      - Label:
          default: AI provider
        Parameters:
          - AiProvider
          - GrantBedrockAccess
      - Label:
          default: Backups
        Parameters:
          - EnableDailySnapshots
          - SnapshotRetentionDays
          - QuiesceForDailySnapshots
    ParameterLabels:
      VpcId: {default: VPC}
      SubnetId: {default: Subnet}
      AssignPublicIp: {default: Give the instance a public IP}
      ImageId: {default: Synaplan AMI}
      InstanceType: {default: Instance type}
      DataVolumeSize: {default: Data volume size in GiB}
      AllowedWebCidr: {default: Allowed source IP range}
      DomainName: {default: Domain name (optional)}
      AdminEmail: {default: Administrator email address}
      KeyName: {default: EC2 key pair (optional)}
      AiProvider: {default: Default AI provider}
      GrantBedrockAccess: {default: Allow this instance to call Amazon Bedrock}
      EnableDailySnapshots: {default: Daily snapshots of the data volume}
      SnapshotRetentionDays: {default: Snapshot retention in days}
      QuiesceForDailySnapshots: {default: Pause the app for the daily snapshot}

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC to deploy into.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      A subnet in that VPC. The instance needs outbound internet access - from a
      public subnet directly, from a private subnet through your NAT gateway -
      to reach the AI provider, to renew its certificate and to pull updates.
      The data volume is created in this subnet's availability zone.

  AssignPublicIp:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Set to false for a private subnet reached over a VPN or a load balancer.
      A Let's Encrypt certificate then cannot be issued, because the HTTP-01
      challenge has to arrive from the internet.

  # AWS Marketplace fills this in per region when a buyer launches the product.
  # Set it yourself only when launching an AMI you built from deploy/aws/packer.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: The Synaplan AMI to launch.

  InstanceType:
    Type: String
    Default: m7i.xlarge
    AllowedValues:
      - c7i.xlarge
      - m7i.xlarge
      - m7i.2xlarge
    Description: >-
      Synaplan needs at least 4 vCPU and 8 GB of memory. These instance types
      require the x86_64 Marketplace AMI.

  DataVolumeSize:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 16000
    Description: >-
      Encrypted EBS volume holding the database, uploads and vectors. It
      outlives the instance, so size it for your documents, not for today.

  AllowedWebCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a CIDR range such as 203.0.113.0/24.
    Description: >-
      Required source range for web access. Use your public IP with /32 for one
      administrator, another trusted CIDR for a network, or 0.0.0.0/0 only when
      you intentionally want to allow the entire internet.

  DomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: Must be a domain name such as synaplan.example.com.
    Description: >-
      A domain whose A record points at this instance. With one, Synaplan gets a
      real Let's Encrypt certificate; without one it serves a self-signed
      certificate and the browser warns on every visit. Billing and any other
      feature that calls back into the installation need a real certificate.

  AdminEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be an email address.
    Description: >-
      Login for the first administrator. The password is generated per instance,
      stored in the SSM Parameter Store, and has to be replaced at the first
      sign-in before anything else works.

  KeyName:
    Type: String
    Default: ''
    Description: >-
      Leave empty. Session Manager gives you a root shell without a key pair and
      without an open SSH port. Name a key pair only if you specifically want
      SSH, and then add the port 22 rule yourself.

  AiProvider:
    Type: String
    Default: groq
    AllowedValues: [groq, openai, anthropic, google, mistral, xai]
    Description: >-
      Which provider Synaplan uses by default. The API key is deliberately not a
      stack parameter - add it after signing in, under Admin then AI Providers,
      where it is stored encrypted. The stack outputs an alternative that needs
      no sign-in.

  GrantBedrockAccess:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Lets the instance call Amazon Bedrock models through its own instance
      role, so models are billed on your AWS account and no third-party API key
      is involved. Synaplan's Bedrock provider ships in a later release; turning
      this on now means the instance is ready for it and you will not have to
      update this stack then. It grants nothing else, and off is the safe
      default.

  EnableDailySnapshots:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Daily snapshots of the data volume through Data Lifecycle Manager. The
      service is free; you pay only for the snapshot storage.

  SnapshotRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
    Description: How many daily snapshots to keep.

  QuiesceForDailySnapshots:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Pause the application for the daily snapshot, so it captures a quiesced
      volume rather than a crash-consistent one. Off by default because Data
      Lifecycle Manager gives the pause script only 120 seconds: past that it
      snapshots mid-write anyway and may leave the application paused. Run
      `sudo synaplan-snapshot` for a consistent snapshot with no time limit.

Conditions:
  WantsBedrock: !Equals [!Ref GrantBedrockAccess, 'true']
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, '']]
  HasPublicIp: !Equals [!Ref AssignPublicIp, 'true']
  WantsDailySnapshots: !Equals [!Ref EnableDailySnapshots, 'true']
  WantsQuiescedSnapshots: !And
    - !Condition WantsDailySnapshots
    - !Equals [!Ref QuiesceForDailySnapshots, 'true']

Mappings:
  # The parameter name the first boot reads a provider key from. It follows the
  # environment variable the application expects, not the label above: Gemini's
  # key is GOOGLE_GEMINI_API_KEY, so `google-api-key` would be a parameter
  # nothing ever reads.
  ProviderKeyParameter:
    groq: {Name: groq-api-key}
    openai: {Name: openai-api-key}
    anthropic: {Name: anthropic-api-key}
    google: {Name: google-gemini-api-key}
    mistral: {Name: mistral-api-key}
    xai: {Name: xai-api-key}

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Synaplan web access (${AWS::StackName})'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedWebCidr
          Description: HTTPS
        # Port 80 only redirects to HTTPS and answers the Let's Encrypt HTTP-01
        # challenge. Without it a domain can never obtain a certificate.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedWebCidr
          Description: HTTP redirect and ACME challenge
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-sg'}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # A shell through Session Manager, so the stack needs neither an SSH key
        # nor an open port 22. In a private subnet this needs the ssm, ssmmessages
        # and ec2messages VPC endpoints, or a NAT gateway.
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: synaplan-instance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The generated administrator password and the optional operator
              # settings. This cannot be narrowed to the instance's own prefix:
              # the instance id only exists after the role, and referring to it
              # here would make the role depend on the instance that depends on
              # the role.
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/synaplan/*'
              # Reading its own tags is how the first boot learns the domain and
              # the administrator address. Neither call supports resource-level
              # permissions.
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                Resource: '*'
              # `synaplan-snapshot`. Two statements because the tag condition
              # describes the snapshot being created, and the volume being read
              # carries no such tag.
              - Effect: Allow
                Action: ec2:CreateSnapshot
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'
              - Effect: Allow
                Action: ec2:CreateSnapshot
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*'
                Condition:
                  StringEquals:
                    aws:RequestTag/synaplan:consistent: application
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*'
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateSnapshot
              # Amazon Bedrock, only when GrantBedrockAccess is on. Inference
              # is all it may do: it cannot enable a model, change a guardrail
              # or read a job. These two actions also cover the Converse API,
              # which has no IAM action of its own. Foundation models are
              # allowed in every region because a cross-region inference
              # profile forwards the call to one of them, and a profile that
              # cannot reach its own models fails with an authorisation error
              # rather than a useful one.
              - !If
                - WantsBedrock
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                    - bedrock:InvokeModelWithResponseStream
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*'
                - !Ref 'AWS::NoValue'
              # Populates the model list in Admin then AI Providers. Neither
              # call supports resource-level permissions.
              - !If
                - WantsBedrock
                - Effect: Allow
                  Action:
                    - bedrock:ListFoundationModels
                    - bedrock:ListInferenceProfiles
                  Resource: '*'
                - !Ref 'AWS::NoValue'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  DataVolume:
    Type: AWS::EC2::Volume
    # Snapshotted rather than destroyed on stack deletion: this volume holds
    # every document, conversation and credential in the installation.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      # The volume has to live where the instance lives, and the instance lives
      # wherever the subnet you picked is.
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-data'}
        - {Key: 'synaplan:role', Value: data}

  # Attached separately rather than through the instance's Volumes property,
  # because the volume already depends on the instance for its availability zone.
  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
          AssociatePublicIpAddress: !If [HasPublicIp, true, false]
          DeleteOnTermination: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      # IMDSv2 only. The first-boot script speaks it, and IMDSv1 turns any
      # request-forgery bug in a web application into credential theft.
      #
      # One hop means the instance credentials are reachable from the host and
      # from nowhere else: a request out of a container crosses the bridge, so
      # the TTL is already spent when it arrives, and a request-forgery bug in
      # the application cannot read the role at all. Bedrock is the one feature
      # that needs the AWS SDK inside the container, so it - and only it -
      # raises the limit.
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: !If [WantsBedrock, 2, 1]
      # Configuration travels as tags, not user data: "Launch from Website"
      # starts the AMI with no user data at all, and both launch paths have to
      # produce the same installation. Nothing secret goes in here - tags are
      # readable by anyone who can describe the instance.
      Tags:
        - {Key: Name, Value: !Ref 'AWS::StackName'}
        - !If
          - HasDomainName
          - {Key: 'synaplan:domain', Value: !Ref DomainName}
          - !Ref 'AWS::NoValue'
        - !If
          - HasAdminEmail
          - {Key: 'synaplan:admin-email', Value: !Ref AdminEmail}
          - !Ref 'AWS::NoValue'
        - {Key: 'synaplan:ai-provider', Value: !Ref AiProvider}
        # Records the grant above, so the release that adds the Bedrock provider
        # can switch it on from the instance itself instead of asking the
        # operator to update this stack a second time.
        - !If
          - WantsBedrock
          - {Key: 'synaplan:bedrock', Value: granted}
          - !Ref 'AWS::NoValue'
        # This stack attaches the data volume only once the instance is running,
        # because the volume takes its availability zone from it. The tag tells
        # the first boot to wait for the device instead of falling back to the
        # root volume.
        - {Key: 'synaplan:data-volume', Value: attached}

  # Registered whether or not the daily policy uses it, because it is also how
  # an operator or an external backup tool quiesces the application from outside
  # the instance. Same content as deploy/aws/ssm/synaplan-backup-document.yaml.
  SnapshotHookDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub '${AWS::StackName}-synaplan-snapshot-hook'
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: >-
          Quiesces Synaplan for an application-consistent EBS snapshot and
          brings it back afterwards.
        # Data Lifecycle Manager treats a document as snapshot-aware only when
        # it declares exactly these two parameters. Neither has a default: an
        # unset value means the caller is not DLM, and that should fail rather
        # than pause the application with nothing scheduled to resume it.
        parameters:
          executionId:
            type: String
            description: Identifier that Data Lifecycle Manager assigns to a snapshot run.
            allowedPattern: '^[A-Za-z0-9_\-]{1,128}$'
          command:
            type: String
            description: Which half to run.
            allowedValues: [pre-script, post-script, dry-run]
        mainSteps:
          - action: aws:runShellScript
            name: synaplanSnapshotHook
            precondition:
              StringEquals: [platformType, Linux]
            inputs:
              timeoutSeconds: 3600
              runCommand:
                - /opt/synaplan/deploy/aws/scripts/snapshot-hook.sh '{{ command }}' '{{ executionId }}'

  SnapshotRole:
    Type: AWS::IAM::Role
    Condition: WantsDailySnapshots
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: dlm.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole'
        - !If
          - WantsQuiescedSnapshots
          - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSDataLifecycleManagerSSMFullAccess'
          - !Ref 'AWS::NoValue'

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Condition: WantsDailySnapshots
    Properties:
      Description: !Sub 'Daily snapshots of the Synaplan data volume (${AWS::StackName})'
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [VOLUME]
        TargetTags:
          - {Key: Name, Value: !Sub '${AWS::StackName}-data'}
        Schedules:
          - Name: daily
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times: ['03:00']
              Scripts: !If
                - WantsQuiescedSnapshots
                - - ExecutionHandler: !Ref SnapshotHookDocument
                    ExecutionHandlerService: AWS_SYSTEMS_MANAGER
                    Stages: [PRE, POST]
                    # If quiescing fails, snapshot anyway: a crash-consistent
                    # copy is worth far more than no copy, and the hooks resume
                    # the services on their own way out.
                    ExecuteOperationOnScriptFailure: true
                    MaximumRetryCount: 0
                    ExecutionTimeout: 120
                - !Ref 'AWS::NoValue'
            RetainRule:
              Count: !Ref SnapshotRetentionDays
            CopyTags: true

Outputs:
  WebUrl:
    Description: Open this to reach Synaplan.
    Value: !If
      - HasDomainName
      - !Sub 'https://${DomainName}'
      - !If
        - HasPublicIp
        - !Sub 'https://${Instance.PublicIp}'
        - !Sub 'https://${Instance.PrivateIp}'

  DnsRecordToCreate:
    Condition: HasDomainName
    Description: >-
      Create this record. Until it resolves, Synaplan serves a self-signed
      certificate, because Let's Encrypt cannot issue for a name it cannot reach.
    Value: !If
      - HasPublicIp
      - !Sub '${DomainName} A ${Instance.PublicIp}'
      - !Sub '${DomainName} A ${Instance.PrivateIp}'

  AdministratorPassword:
    Description: >-
      Reveals the generated administrator password. It is single-use - the first
      sign-in has to replace it before the application does anything else.
    Value: !Sub >-
      aws ssm get-parameter --with-decryption --region ${AWS::Region} --name
      /synaplan/${Instance}/admin-password --query Parameter.Value --output text

  AdministratorEmail:
    Description: >-
      Sign in with this address. Without an AdminEmail the first boot derives one
      from the domain, and falls back to the example address when there is no
      domain either.
    Value: !If
      - HasAdminEmail
      - !Ref AdminEmail
      - !If
        - HasDomainName
        - !Sub 'admin@${DomainName}'
        - 'admin@example.com'

  SetAiProviderKey:
    Description: >-
      Adds the API key without signing in or opening a shell; reboot the
      instance afterwards. Signing in and using Admin then AI Providers does the
      same thing and needs no AWS permissions.
    Value: !Sub
      - >-
        aws ssm put-parameter --type SecureString --region ${AWS::Region} --name
        /synaplan/${Instance}/config/${KeyParameter} --value YOUR_API_KEY
      - KeyParameter: !FindInMap [ProviderKeyParameter, !Ref AiProvider, Name]

  ShellCommand:
    Description: A shell on the instance, with no SSH key and no open port 22.
    Value: !Sub 'aws ssm start-session --region ${AWS::Region} --target ${Instance}'

  DataVolumeId:
    Description: >-
      The volume holding all your data. Deleting this stack snapshots it rather
      than destroying it.
    Value: !Ref DataVolume

  InstanceId:
    Description: The Synaplan instance.
    Value: !Ref Instance
